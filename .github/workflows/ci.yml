name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  NODE_VERSION: '24.13.0'
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci --include=dev
      - run: npm run lint

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci --include=dev
      - run: npm run typecheck

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci --include=dev
      - run: npm run test:coverage
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: test-results
          path: |
            coverage
            junit.xml
          retention-days: 30

  validate-tokens:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci --include=dev
      - run: npm run sync-theme
      - name: Check tokens are in sync
        run: |
          if [ -n "$(git status --porcelain constants/wdsTokens.ts constants/wds-theme.css)" ]; then
            echo "Design tokens are out of sync. Run 'npm run sync-theme' locally."
            exit 1
          fi

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci --include=dev
      - name: Dependency audit
        run: npm audit --omit=dev --audit-level=high
        continue-on-error: true
      - name: Secret detection
        uses: trufflesecurity/trufflehog@main

  export:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    needs: [lint, typecheck, test, validate-tokens]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci --include=dev
      - run: npx expo export --platform ios --output-dir dist-ios
      - run: npx expo export --platform android --output-dir dist-android
      - run: npm run export:web
      - uses: actions/upload-artifact@v5
        with:
          name: dist
          path: dist
          retention-days: 7

