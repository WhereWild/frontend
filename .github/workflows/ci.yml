name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  NODE_VERSION: '24.13.0'

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci --include=dev
      - run: npm run lint

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci --include=dev
      - run: npm run typecheck

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci --include=dev
      - run: npm run test:ci
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: coverage
          retention-days: 30
      - name: Validate coverage thresholds
        run: |
          node -e '
          const fs = require("fs");
          const path = "coverage/coverage-summary.json";
          const target = { branches: 90, functions: 90, lines: 90, statements: 90 };

          if (!fs.existsSync(path)) {
            console.error("Missing coverage summary at " + path);
            process.exit(1);
          }

          const summary = JSON.parse(fs.readFileSync(path, "utf8"));
          const total = summary.total || {};

          const failures = Object.entries(target)
            .map(([metric, min]) => {
              const pct = total[metric]?.pct;
              const validPct = typeof pct === "number" ? pct : Number(pct);
              if (!Number.isFinite(validPct)) return metric + ": missing";
              return validPct < min ? metric + ": " + validPct + "% < " + min + "%" : null;
            })
            .filter(Boolean);

          if (failures.length > 0) {
            console.error("Coverage threshold not met:");
            for (const failure of failures) console.error("- " + failure);
            process.exit(1);
          }

          console.log("Coverage threshold met.");
          '
        continue-on-error: true

  validate-tokens:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci --include=dev
      - run: npm run sync-theme
      - name: Check tokens are in sync
        run: |
          if [ -n "$(git status --porcelain constants/wdsTokens.ts constants/wds-theme.css)" ]; then
            echo "Design tokens are out of sync. Run 'npm run sync-theme' locally."
            exit 1
          fi

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci --include=dev
      - name: Dependency audit
        run: npm audit --omit=dev --audit-level=high
        continue-on-error: true
      - name: Secret detection
        uses: trufflesecurity/trufflehog@main
        with:
          extra_args: --only-verified

  export:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    needs: [lint, typecheck, test]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci --include=dev
      - run: npx expo export --platform ios --output-dir dist-ios
      - run: npx expo export --platform android --output-dir dist-android
      - run: npm run export:web
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 7

  package:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    needs: [export]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: NODE_VERSION=${{ env.NODE_VERSION }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/wherewild-frontend:latest
            ghcr.io/${{ github.repository_owner }}/wherewild-frontend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
