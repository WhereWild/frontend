name: Deploy

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  deploy:
    runs-on: [self-hosted, Linux, X64]
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build web export
        env:
          APP_BACKEND_URL: https://api.wherewild.net
        run: npm run export:web -- --backendUrl=https://api.wherewild.net
      - name: Inject build version into service worker
        run: sed -i "s/__BUILD_VERSION__/${{ github.sha }}/g" dist/sw.js

      - name: Copy dist to server
        run: |
          cd ~/wherewild/frontend && git fetch origin main && git reset --hard origin/main
          rsync -av $GITHUB_WORKSPACE/dist/ ~/wherewild/frontend/dist/

      - name: Rebuild and restart frontend container
        run: |
          cd ~/wherewild/backend-v2
          docker compose -f docker-compose.optiplex.yml build frontend
          docker compose -f docker-compose.optiplex.yml rm -sf frontend
          docker compose -f docker-compose.optiplex.yml up -d frontend
