stages:
  - install
  - lint
  - test
  - build
  - security

variables:
  NODE_VERSION: "20"
  NPM_CONFIG_CACHE: "$CI_PROJECT_DIR/.npm"
  EXPO_CACHE_DIR: "$CI_PROJECT_DIR/.expo-cache"

# Cache node_modules between jobs
cache:
  key:
    files:
      - package-lock.json
  paths:
    - .npm
    - node_modules
    - .expo-cache

# Install dependencies
install:
  stage: install
  image: node:${NODE_VERSION}
  script:
    - npm ci --cache .npm --prefer-offline
  artifacts:
    expire_in: 1 day
    paths:
      - node_modules

# Linting
lint:
  stage: lint
  image: node:${NODE_VERSION}
  needs: [install]
  script:
    - npm run lint
  allow_failure: false

# Type checking
typecheck:
  stage: lint
  image: node:${NODE_VERSION}
  needs: [install]
  script:
    - npx tsc --noEmit
  allow_failure: false

# Unit tests
test:unit:
  stage: test
  image: node:${NODE_VERSION}
  needs: [install]
  script:
    - npm run test:ci
  coverage: '/All files[^|]*\|[^|]*\s+([\d\.]+)/'
  artifacts:
    when: always
    reports:
      junit: junit.xml
      coverage_report:
        coverage_format: cobertura
        path: coverage/cobertura-coverage.xml
    paths:
      - coverage
    expire_in: 30 days

# Design token sync validation
validate:tokens:
  stage: test
  image: node:${NODE_VERSION}
  needs: [install]
  script:
    - npm run sync-theme
    - |
      if [ -n "$(git status --porcelain constants/wdsTokens.ts constants/wds-theme.css)" ]; then
        echo "Design tokens are out of sync! Run 'npm run sync-theme' locally."
        exit 1
      fi
  allow_failure: false

# Build validation (ensures app can build)
build:expo:
  stage: build
  image: node:${NODE_VERSION}
  needs: [test:unit, lint, typecheck]
  script:
    - npx expo export --platform ios --output-dir dist-ios
    - npx expo export --platform android --output-dir dist-android
  artifacts:
    paths:
      - dist-ios
      - dist-android
    expire_in: 7 days
  only:
    - main
    - develop

# Security scanning
security:dependencies:
  stage: security
  image: node:${NODE_VERSION}
  needs: [install]
  script:
    - npm audit --production --audit-level=high
  allow_failure: true

secret_detection:
  stage: security
  variables:
    SECRET_DETECTION_ENABLED: 'true'

include:
  - template: Security/Secret-Detection.gitlab-ci.yml

