default:
  image: node:${NODE_VERSION}

stages:
  - install
  - lint
  - test
  - export
  - package
  - security

variables:
  NODE_VERSION: "24.13.0"
  NPM_CONFIG_CACHE: "$CI_PROJECT_DIR/.npm"
  EXPO_CACHE_DIR: "$CI_PROJECT_DIR/.expo-cache"
  DOCKER_TLS_CERTDIR: ""
  DOCKER_HOST: "tcp://docker:2375"
  DOCKER_DRIVER: overlay2
  # Override in GitLab CI/CD variables if you want a different repo/name.
  DOCKER_IMAGE: "$DOCKERHUB_USERNAME/wherewild-frontend"

# Cache node_modules between jobs
cache:
  key:
    prefix: "${CI_PROJECT_PATH_SLUG}-${CI_COMMIT_REF_SLUG}"
    files:
      - package-lock.json
  paths:
    - .npm
    - .expo

# Install dependencies
deps:install:
  stage: install
  script:
    - npm ci --include=dev --cache .npm --prefer-offline
  # This is way too slow with Cat Nest's 40 Mbps max uplink.
  # artifacts:
  #   when: on_success
  #   paths:
  #     - node_modules
  #   expire_in: 24 hour

# Linting
validate:lint:
  stage: lint
  needs: [deps:install]
  script:
    - npm ci --include=dev --cache .npm --prefer-offline
    - npm run lint

# Type checking
validate:typecheck:
  stage: lint
  needs: [deps:install]
  script:
    - npm ci --include=dev --cache .npm --prefer-offline
    - npm run typecheck

# Unit tests
test:unit:
  stage: test
  needs: [deps:install]
  script:
    - npm ci --include=dev --cache .npm --prefer-offline
    - npm run test:ci
  coverage: '/All files[^|]*\|[^|]*\s+([\d\.]+)/'
  artifacts:
    when: always
    reports:
      junit: junit.xml
      coverage_report:
        coverage_format: cobertura
        path: coverage/cobertura-coverage.xml
    paths:
      - coverage
    expire_in: 30 days

# Coverage validation (warning-only)
validate:coverage:
  stage: test
  needs:
    - job: test:unit
      artifacts: true
  script:
    - |
      node -e '
      const fs = require("fs");
      const path = "coverage/coverage-summary.json";
      const target = { branches: 90, functions: 90, lines: 90, statements: 90 };

      if (!fs.existsSync(path)) {
        console.error("Missing coverage summary at " + path);
        process.exit(1);
      }

      const summary = JSON.parse(fs.readFileSync(path, "utf8"));
      const total = summary.total || {};

      const failures = Object.entries(target)
        .map(([metric, min]) => {
          const pct = total[metric]?.pct;
          const validPct = typeof pct === "number" ? pct : Number(pct);
          if (!Number.isFinite(validPct)) return metric + ": missing";
          return validPct < min ? metric + ": " + validPct + "% < " + min + "%" : null;
        })
        .filter(Boolean);

      if (failures.length > 0) {
        console.error("Coverage threshold not met:");
        for (const failure of failures) console.error("- " + failure);
        process.exit(1);
      }

      console.log("Coverage threshold met.");
      '
  allow_failure: true

# Design token sync validation
validate:tokens:
  stage: test
  needs: [deps:install]
  script:
    - npm ci --include=dev --cache .npm --prefer-offline
    - npm run sync-theme
    - |
      if [ -n "$(git status --porcelain constants/wdsTokens.ts constants/wds-theme.css)" ]; then
        echo "Design tokens are out of sync! Run 'npm run sync-theme' locally."
        exit 1
      fi

# Build validation (ensures app can build)
validate:expo-export:
  stage: export
  needs:
    - test:unit
    - validate:lint
    - validate:typecheck
  script:
    - npm ci --include=dev --cache .npm --prefer-offline
    - npx expo export --platform ios --output-dir dist-ios
    - npx expo export --platform android --output-dir dist-android
    - npx expo export --platform web --output-dir dist-web
  artifacts:
    paths:
      - dist-web
    expire_in: 7 days
  only:
    - main

package:web-image:
  stage: package
  image: docker:27
  tags: [dind-privileged]
  services:
    - name: docker:27-dind
  needs:
    - job: validate:expo-export
      artifacts: true
  script:
    - echo "$DOCKERHUB_TOKEN" | docker login --username "$DOCKERHUB_USERNAME" --password-stdin
    - docker build -f Dockerfile -t "$DOCKER_IMAGE:latest" -t "$DOCKER_IMAGE:$CI_COMMIT_SHA" .
    - docker push "$DOCKER_IMAGE:latest"
    - docker push "$DOCKER_IMAGE:$CI_COMMIT_SHA"
  only:
    - main

# Security scanning
security:dependencies:
  stage: security
  script:
    - npm audit --omit=dev --audit-level=high
  allow_failure: true

secret_detection:
  stage: security
  variables:
    SECRET_DETECTION_ENABLED: 'true'

include:
  - template: Security/Secret-Detection.gitlab-ci.yml
