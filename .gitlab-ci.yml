default:
  image: node:${NODE_VERSION}

stages:
  - install
  - lint
  - test
  - build
  - security

variables:
  NODE_VERSION: "24.13.0"
  NPM_CONFIG_CACHE: "$CI_PROJECT_DIR/.npm"
  EXPO_CACHE_DIR: "$CI_PROJECT_DIR/.expo-cache"
  DESIGN_SYSTEM_PATH: "$CI_PROJECT_DIR/.design-system"

# Cache node_modules between jobs
cache:
  key:
    prefix: "${CI_PROJECT_PATH_SLUG}-${CI_COMMIT_REF_SLUG}"
    files:
      - package-lock.json
  paths:
    - .npm
    - .expo

# Install dependencies
install:
  stage: install
  script:
    - npm ci --include=dev --cache .npm --prefer-offline
  # This is way too slow with Cat Nest's 40 Mbps max uplink.
  # artifacts:
  #   when: on_success
  #   paths:
  #     - node_modules
  #   expire_in: 24 hour

# Linting
lint:
  stage: lint
  needs: [install]
  script:
    - npm ci --include=dev --cache .npm --prefer-offline
    - npm run lint

# Type checking
typecheck:
  stage: lint
  needs: [install]
  script:
    - npm ci --include=dev --cache .npm --prefer-offline
    - npm run typecheck

# Unit tests
test:unit:
  stage: test
  needs: [install]
  script:
    - npm ci --include=dev --cache .npm --prefer-offline
    - npm run test:ci
  coverage: '/All files[^|]*\|[^|]*\s+([\d\.]+)/'
  artifacts:
    when: always
    reports:
      junit: junit.xml
      coverage_report:
        coverage_format: cobertura
        path: coverage/cobertura-coverage.xml
    paths:
      - coverage
    expire_in: 30 days

# Design token sync validation
validate:tokens:
  stage: test
  needs: [install]
  script:
    - npm ci --include=dev --cache .npm --prefer-offline
    - |
      rm -rf "$DESIGN_SYSTEM_PATH"
      git clone --depth 1 https://github.com/KellyNyanbinary/WhereWild-Design-System.git "$DESIGN_SYSTEM_PATH"
    - npm run sync-theme
    - |
      if [ -n "$(git status --porcelain constants/wdsTokens.ts constants/wds-theme.css)" ]; then
        echo "Design tokens are out of sync! Run 'npm run sync-theme' locally."
        exit 1
      fi
  # Because there is only one design system branch, it is possible for another
  # dev's unrelated design system changes result in this pipeline failing.
  allow_failure: true

# Build validation (ensures app can build)
build:expo:
  stage: build
  needs: [test:unit, lint, typecheck]
  script:
    - npm ci --include=dev --cache .npm --prefer-offline
    - npx expo export --platform ios --output-dir dist-ios
    - npx expo export --platform android --output-dir dist-android
    - npx expo export --platform web --output-dir dist-web
  artifacts:
    paths:
      - dist-ios
      - dist-android
      - dist-web
    expire_in: 7 days
  only:
    - main

# Security scanning
security:dependencies:
  stage: security
  script:
    - npm audit --omit=dev --audit-level=high
  allow_failure: true

secret_detection:
  stage: security
  variables:
    SECRET_DETECTION_ENABLED: 'true'

include:
  - template: Security/Secret-Detection.gitlab-ci.yml
