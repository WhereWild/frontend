<!--
  MapLibre GL JS globe-projection counterpart to SpeciesOccurrenceMap.html.
  Speaks the exact same postMessage protocol (pointValue, pin_observation,
  mapBounds, tilesChanged, selected_point, highlight, heatmapUpdate,
  pointStylesUpdate, localLocationUpdate, locationPicked, open_external_url) so
  SpeciesOccurrenceMap.tsx's message handling works unmodified against either
  renderer. Full parity with SpeciesOccurrenceMap.html: basemap, heatmap
  overlay, click point-query, occurrence markers (colored/shaped, native
  MapLibre GeoJSON clustering), highlighting, and live colormap recoloring.
-->

<!DOCTYPE html>
<html>

<head>
  <meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no" />
  <meta name="referrer" content="__REFERRER_POLICY__" />
  <base href="__DOCUMENT_BASE_URL__" />
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5.24.0/dist/maplibre-gl.css" />
  <style>
    html, body, #map { height: 100%; width: 100%; margin: 0; padding: 0; background: #000; }
    .maplibregl-popup-content { font: 12px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  </style>
</head>

<body>
  <div id="map"></div>
  <script src="https://unpkg.com/maplibre-gl@5.24.0/dist/maplibre-gl.js"></script>
  <script src="https://unpkg.com/gl-matrix@3.4.3/gl-matrix-min.js"></script>
  <script>
    const points = __POINTS_JSON__;
    const palette = __PALETTE_JSON__;
    const HIGHLIGHT_MESSAGE_TYPE = __HIGHLIGHT_MESSAGE_TYPE_JSON__;
    const PIN_OBSERVATION_MESSAGE_TYPE = __PIN_OBSERVATION_MESSAGE_TYPE_JSON__;
    const SELECTED_POINT_MESSAGE_TYPE = __SELECTED_POINT_MESSAGE_TYPE_JSON__;
    const OPEN_EXTERNAL_URL_MESSAGE_TYPE = __OPEN_EXTERNAL_URL_MESSAGE_TYPE_JSON__;

    var PARENT_POSTMESSAGE_ORIGIN = (function() {
      try {
        var params = new URLSearchParams(window.location.search || '');
        var configured = params.get('parentOrigin');
        if (!configured) return '*';
        var parsed = new URL(configured);
        if (parsed.protocol !== 'https:' && parsed.protocol !== 'http:') return '*';
        return parsed.origin;
      } catch (e) { return '*'; }
    })();

    function postToParent(msg) {
      if (window.ReactNativeWebView) {
        window.ReactNativeWebView.postMessage(JSON.stringify(msg));
      } else {
        window.parent.postMessage(msg, PARENT_POSTMESSAGE_ORIGIN);
      }
    }

    const TILE_REFERRER_POLICY = __REFERRER_POLICY_JSON__;
    const TILE_URL = __TILE_URL_JSON__;
    const TILE_MAX_ZOOM = __TILE_MAX_ZOOM__;
    const MAP_TILE_MODE = __MAP_TILE_MODE_JSON__;
    const UNIT_SYSTEM = __UNIT_SYSTEM_JSON__;
    const ENABLE_OFFLINE_FALLBACK = __ENABLE_OFFLINE_FALLBACK__;
    const HEATMAP_TILE_URL = __HEATMAP_TILE_URL_JSON__;
    const HEATMAP_OPACITY = __HEATMAP_OPACITY__;
    const LABELS_OVERLAY_URL = __LABELS_OVERLAY_URL_JSON__;
    const LINES_OVERLAY_URL = __LINES_OVERLAY_URL_JSON__;
    const TERRAIN_TILE_URL = __TERRAIN_TILE_URL_JSON__;
    // Persisted like the globe-vs-2D preference (see settings.terrainEnabled)
    // — read once at load so a reload/return visit starts wherever the user
    // last left the toggle, rather than always defaulting on.
    const TERRAIN_ENABLED_INITIAL = __TERRAIN_ENABLED__;
    // Esri World Imagery, proxied through our own backend (see
    // wherewild/main.py's satellite_tile) so the ArcGIS API key never
    // reaches the client — standard {z}/{x}/{y} order, unlike Esri's own
    // z/y/x tile path, since the backend handles that reversal.
    const SATELLITE_TILE_URL = __SATELLITE_TILE_URL_JSON__;
    // 'variable' basemap mode's basemap tile — the same simpler background
    // maps.tsx always uses (paired with LABELS_OVERLAY_URL below), rather
    // than the full-detail TILE_URL used for 'standard' mode.
    const VARIABLE_MODE_BACKGROUND_TILE_URL = __VARIABLE_MODE_BACKGROUND_TILE_URL_JSON__;
    // 'standard' | 'satellite' | 'variable' — same persisted-preference
    // pattern as TERRAIN_ENABLED_INITIAL.
    const BASEMAP_MODE_INITIAL = __BASEMAP_MODE_INITIAL_JSON__;
    // The 'standard' basemap mode's own look — 'default' (CARTO
    // Positron/Dark Matter, light/dark-aware) or 'versatiles' (CARTO's
    // colorful single-look style). Same persisted-preference read-once
    // pattern as BASEMAP_MODE_INITIAL above.
    const STANDARD_THEME_INITIAL = __STANDARD_THEME_INITIAL_JSON__;
    // Every registered standard theme's { id, url } pair, already resolved
    // for the current light/dark mode (see getStandardThemeCycle in
    // speciesOccurrenceMapHelpers.ts) and fetched up front like
    // SATELLITE_TILE_URL, so the toggle below can cycle through all of them
    // client-side with no round trip. An array (not a single "alt" URL) so
    // this is a genuine N-way cycle, not a hardcoded 2-way one — adding a
    // theme is a backend/helpers.ts change, never a template change. Null
    // on pages without the 3-way basemap toggle at all (see standardThemes'
    // gating in SpeciesOccurrenceMap.tsx).
    const STANDARD_THEMES = __STANDARD_THEMES_JSON__;
    // Tracks whatever the currently-selected GIS variable's tile URL is —
    // starts at HEATMAP_TILE_URL but updates live via applyPendingHeatmapUpdate
    // below, so 'variable' basemap mode always reflects the live selection
    // rather than whatever was true at page load.
    var currentHeatmapTileUrl = HEATMAP_TILE_URL;
    var INITIAL_BASEMAP_MODE = (BASEMAP_MODE_INITIAL === 'variable' && !currentHeatmapTileUrl)
      ? 'standard'
      : (BASEMAP_MODE_INITIAL || 'standard');
    // 'satellite' swaps in the satellite tile; 'variable' swaps in the
    // simpler background tile (same one maps.tsx always uses, paired with
    // the labels overlay — see the labels-layer visibility logic below),
    // plus the heatmap overlay on top; 'standard' is the plain full-detail
    // tile.
    // Which of STANDARD_THEMES is active — declared up front (like
    // currentHeatmapTileUrl above) since tileUrlForBasemapMode needs it for
    // the very first tile request, before the theme toggle control below
    // (which only exists when STANDARD_THEMES is set) ever runs.
    var currentStandardTheme = STANDARD_THEME_INITIAL;
    // Looks currentStandardTheme's URL up in STANDARD_THEMES by id rather
    // than a hardcoded default-vs-alt branch — works for any number of
    // registered themes. Falls back to TILE_URL (the 'default' theme's own
    // URL, always present even on pages without the toggle at all) if the
    // list is missing or the id isn't found in it.
    function standardThemeUrl(theme) {
      if (!STANDARD_THEMES) return null;
      for (var i = 0; i < STANDARD_THEMES.length; i++) {
        if (STANDARD_THEMES[i].id === theme) return STANDARD_THEMES[i].url;
      }
      return null;
    }
    function tileUrlForBasemapMode(mode) {
      if (mode === 'satellite' && SATELLITE_TILE_URL) return SATELLITE_TILE_URL;
      if (mode === 'variable' && VARIABLE_MODE_BACKGROUND_TILE_URL) return VARIABLE_MODE_BACKGROUND_TILE_URL;
      return standardThemeUrl(currentStandardTheme) || TILE_URL;
    }
    // Whatever region(s) were already drawn/uploaded when this map was
    // (re)built — e.g. switching here from Leaflet after drawing a region
    // there. Rings are [latitude, longitude] pairs, same convention as
    // allDrawnPolygonPoints/drawnPolygonGroups below. Seeded onto the same
    // drawn-polygons source those use, once it exists (see map.on('load')),
    // so the filter that was already active keeps its visual too instead of
    // only its effect surviving the renderer switch.
    const INITIAL_DRAWN_POLYGONS = __INITIAL_DRAWN_POLYGONS_JSON__;
    const CUSTOM_MIN_ZOOM = __MIN_ZOOM__;
    const CUSTOM_MAX_ZOOM = __MAX_ZOOM__;
    const INITIAL_LAT = __INITIAL_LAT__;
    const INITIAL_LON = __INITIAL_LON__;
    const INITIAL_ZOOM = __INITIAL_ZOOM__;
    const SHOW_MARKERS = __SHOW_MARKERS__;
    const MAX_VISIBLE_UNCLUSTERED_OBSERVATIONS = __MAX_VISIBLE_UNCLUSTERED_OBSERVATIONS__;
    const ALLOW_PIN_OBSERVATIONS = __ALLOW_PIN_OBSERVATIONS__;
    const LINK_OBSERVATIONS = __LINK_OBSERVATIONS__;
    const LOCATION_PICKER_MODE = __LOCATION_PICKER_MODE__;
    const INITIAL_LOCAL_LAT = __INITIAL_LOCAL_LAT_JSON__;
    const INITIAL_LOCAL_LON = __INITIAL_LOCAL_LON_JSON__;
    let POINT_QUERY_URL = __POINT_QUERY_URL_JSON__;
    let IS_CIRCULAR = __IS_CIRCULAR__;
    let DOT_MIN = __DOT_MIN_JSON__;
    let DOT_MAX = __DOT_MAX_JSON__;
    let RENDER_MIN = __RENDER_MIN_JSON__;
    let RENDER_MAX = __RENDER_MAX_JSON__;
    const ENABLE_AUTO_ADAPT_TOGGLE = __ENABLE_AUTO_ADAPT_TOGGLE__;
    // Whether the ruler-icon auto-adapt button is currently relevant
    // (a plain numeric-gradient variable) and toggled on — kept live via
    // 'heatmapUpdate' (see below) since a plain variable switch reuses this
    // same document instead of rebuilding it (see preserveMapPosition).
    let AUTO_ADAPT_APPLICABLE = __AUTO_ADAPT_APPLICABLE_INITIAL__;
    let AUTO_ADAPT_ENABLED = __AUTO_ADAPT_ENABLED_INITIAL__;
    const DISABLE_OBSERVATION_QUERY = __DISABLE_OBSERVATION_QUERY__;
    let VAR_UNITS = __VAR_UNITS_JSON__;
    let CLASS_COLORS = __CLASS_COLORS_JSON__;
    let CLASS_LABELS = __CLASS_LABELS_JSON__;
    let MARKER_OUTLINE = __MARKER_OUTLINE__;
    const CUSTOM_MAX_BOUNDS = __MAX_BOUNDS_JSON__;

    var GRADIENT_STOPS = __GRADIENT_STOPS_JSON__;
    function gradientColor(t) {
      var n = GRADIENT_STOPS.length - 1;
      var i = Math.min(Math.floor(t * n), n - 1);
      var f = t * n - i;
      var c0 = GRADIENT_STOPS[i], c1 = GRADIENT_STOPS[i + 1];
      return 'rgb(' + Math.round(c0[0]+f*(c1[0]-c0[0])) + ',' + Math.round(c0[1]+f*(c1[1]-c0[1])) + ',' + Math.round(c0[2]+f*(c1[2]-c0[2])) + ')';
    }
    var ASPECT_STOPS = __ASPECT_STOPS_JSON__;
    function aspectColor(deg) {
      var n = ASPECT_STOPS.length;
      var t = ((deg % 360) + 360) % 360 / 360;
      var fi = t * n;
      var i = Math.floor(fi) % n;
      var f = fi - Math.floor(fi);
      var c0 = ASPECT_STOPS[i], c1 = ASPECT_STOPS[(i + 1) % n];
      return 'rgb('+Math.round(c0[0]+f*(c1[0]-c0[0]))+','+Math.round(c0[1]+f*(c1[1]-c0[1]))+','+Math.round(c0[2]+f*(c1[2]-c0[2]))+')';
    }
    function safeT(val, lo, hi) {
      return lo < hi ? Math.max(0, Math.min(1, (val - lo) / (hi - lo))) : 0;
    }

    // Shape marker icons — ported from the Leaflet template's SHAPE_POINTS
    // table (8×8 coordinate system, center (4,4), radius 4). MapLibre's
    // circle layers can only ever draw circles, so anything else needs to
    // be a symbol layer with a pre-rendered icon image — these get drawn
    // on a canvas on demand and registered via map.addImage(), cached by a
    // key derived from shape+fill+stroke so the same combo is never redrawn.
    var SHAPE_POINTS = {
      square:          [[0, 0], [8, 0], [8, 8], [0, 8]],
      triangle:        [[4, -0.4], [8.4, 8.4], [-0.4, 8.4]],
      'triangle-down': [[-0.4, -0.4], [8.4, -0.4], [4, 8.4]],
      diamond:         [[4, 0], [8, 4], [4, 8], [0, 4]],
      cross:           [[1.5, 0], [4, 2.5], [6.5, 0], [8, 1.5], [5.5, 4], [8, 6.5], [6.5, 8], [4, 5.5], [1.5, 8], [0, 6.5], [2.5, 4], [0, 1.5]],
      plus:            [[3, 0], [5, 0], [5, 3], [8, 3], [8, 5], [5, 5], [5, 8], [3, 8], [3, 5], [0, 5], [0, 3], [3, 3]],
      star:            [[4, 0], [5, 3], [8, 4], [5, 5], [4, 8], [3, 5], [0, 4], [3, 3]],
      hexagon:         [[8, 4], [6, 7.46], [2, 7.46], [0, 4], [2, 0.54], [6, 0.54]],
      pentagon:        [[4, 0], [7.8, 2.76], [6.35, 7.24], [1.65, 7.24], [0.2, 2.76]],
      arrow:           [[0, 2.5], [5, 2.5], [5, 0], [8, 4], [5, 8], [5, 5.5], [0, 5.5]],
    };
    var SHAPE_ICON_SIZE = 20;

    function shapeIconKey(shape, fillColor, strokeColor) {
      return 'marker-' + (shape || 'circle') + '-' + fillColor + '-' + (strokeColor || 'none');
    }

    function ensureShapeIcon(shape, fillColor, strokeColor) {
      var key = shapeIconKey(shape, fillColor, strokeColor);
      if (map.hasImage(key)) return key;
      var canvas = document.createElement('canvas');
      canvas.width = SHAPE_ICON_SIZE;
      canvas.height = SHAPE_ICON_SIZE;
      var ctx = canvas.getContext('2d');
      var cx = SHAPE_ICON_SIZE / 2, cy = SHAPE_ICON_SIZE / 2, r = SHAPE_ICON_SIZE * 0.4;

      ctx.beginPath();
      if (shape === 'ring') {
        ctx.arc(cx, cy, r, 0, Math.PI * 2);
        ctx.lineWidth = 2.5;
        ctx.strokeStyle = fillColor;
        ctx.stroke();
        map.addImage(key, ctx.getImageData(0, 0, SHAPE_ICON_SIZE, SHAPE_ICON_SIZE));
        return key;
      }

      var pts = shape && SHAPE_POINTS[shape];
      if (pts) {
        var s = r / 4;
        pts.forEach(function(p, i) {
          var x = cx + (p[0] - 4) * s;
          var y = cy + (p[1] - 4) * s;
          if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
        });
        ctx.closePath();
      } else {
        ctx.arc(cx, cy, r, 0, Math.PI * 2);
      }
      ctx.fillStyle = fillColor;
      ctx.fill();
      if (strokeColor) {
        ctx.lineWidth = 2;
        ctx.strokeStyle = strokeColor;
        ctx.stroke();
      }

      map.addImage(key, ctx.getImageData(0, 0, SHAPE_ICON_SIZE, SHAPE_ICON_SIZE));
      return key;
    }

    // Occurrence marker color resolution — mirrors Leaflet's
    // baseStyleForPoint: a precomputed varColor wins if present
    // (categorical classColors case); otherwise fall back to computing from
    // the raw varValue using whichever colormap is active (circular/aspect
    // takes priority over continuous gradient, matching Leaflet). Points
    // with no resolvable color while some colormap IS active get a
    // distinct nodata style instead of silently using the plain default.
    var OCCURRENCE_POINTS = [];
    // Set inside the SHOW_MARKERS block below (once the occurrences source/
    // layers exist) — swaps in a genuinely different set of points (e.g. a
    // location/phenology filter refetch) and repositions the camera, unlike
    // refreshOccurrenceMarkerColors which only recolors the existing set.
    var replaceOccurrencePointsImpl = null;
    function replaceOccurrencePoints(newPoints) {
      if (replaceOccurrencePointsImpl) {
        replaceOccurrencePointsImpl(newPoints);
      }
    }

    function isVariableColorMode() {
      return IS_CIRCULAR
        || (DOT_MIN != null && DOT_MAX != null && DOT_MAX >= DOT_MIN)
        || (CLASS_COLORS != null && Object.keys(CLASS_COLORS).length > 0);
    }

    function resolveMarkerColor(pt) {
      if (pt.varColor) return pt.varColor;
      if (IS_CIRCULAR && pt.varValue != null) return aspectColor(pt.varValue);
      if (DOT_MIN != null && DOT_MAX != null && DOT_MAX >= DOT_MIN && pt.varValue != null) {
        return gradientColor(safeT(pt.varValue, DOT_MIN, DOT_MAX));
      }
      return null;
    }

    function buildOccurrenceFeature(pt) {
      var color = resolveMarkerColor(pt);
      var isNodata = !color && isVariableColorMode();
      var outlineStroke = MARKER_OUTLINE ? 'rgba(176,176,176,0.65)' : null;
      var displayColor = isNodata ? '#ffffff' : (color || palette.markerFill);
      var displayStroke = isNodata ? '#999999' : (outlineStroke || displayColor);
      var hasShape = !!pt.varShape;
      // Canvas-rasterized icons only for markers that actually have a
      // shape — MapLibre's native circle layer renders perfectly smooth,
      // GPU-vector circles at any zoom/DPI, so the plain default case stays
      // on that instead of a small rasterized sprite (which looked visibly
      // rough/"deformed" by comparison).
      var iconKey = hasShape ? ensureShapeIcon(pt.varShape, displayColor, displayStroke) : null;
      return {
        type: 'Feature',
        geometry: { type: 'Point', coordinates: [pt.longitude, pt.latitude] },
        properties: {
          catalog: pt.popupCatalogValue || '',
          catalogHref: pt.popupCatalogHref || '',
          catalogLabel: pt.popupCatalogLabel || '',
          varValue: pt.varValue != null ? pt.varValue : null,
          // Kept separate from markerColor/iconKey (below): rawVarColor/
          // varLabel are the precomputed-server-side categorical values,
          // used to decide/populate the popup content, not for styling.
          rawVarColor: pt.varColor || null,
          varLabel: pt.varLabel || null,
          hasShape: hasShape,
          iconKey: iconKey,
          markerColor: displayColor,
          markerStroke: displayStroke,
          isNodata: isNodata,
          mediaUrl: pt.popupMediaUrl || '',
          mediaAttribution: pt.popupMediaAttribution || '',
          mediaLicense: pt.popupMediaLicense || '',
          mediaLicenseUrl: pt.popupMediaLicenseUrl || '',
        },
      };
    }

    // Popup content for a clicked MARKER — distinct from
    // formatPointValueHtml (which is for the empty-map point-QUERY case,
    // driven by a fresh backend response). Mirrors Leaflet's
    // buildObservationValueHtml: a precomputed varColor+varLabel (the
    // categorical case) is used as-is rather than recomputed from the
    // CLASS_COLORS/CLASS_LABELS globals, which is what caused the label to
    // fall back to a bare class number instead of resolving.
    function buildMarkerValueHtml(pt) {
      if (pt.varValue == null) {
        return isVariableColorMode()
          ? '<div style="margin-top:4px"><span style="opacity:0.6;font-size:11px">No data</span></div>'
          : '';
      }
      if (pt.varColor) {
        var dot = '<span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:' + pt.varColor + ';margin-right:5px;flex-shrink:0"></span>';
        var labelText = pt.varLabel || '';
        return '<div style="display:flex;align-items:center;font-size:12px;margin-top:4px">' + dot + (labelText ? '<span>' + labelText + '</span>' : '') + '</div>';
      }
      return formatPointValueHtml(pt.varValue, VAR_UNITS);
    }

    // Mirrors Leaflet's buildObservationMediaHtml — mediaAttribution/
    // mediaLicense arrive pre-escaped from preparePointsForMapHtml.
    function buildObservationMediaHtml(mediaUrl, mediaAttribution, mediaLicense, mediaLicenseUrl) {
      if (!mediaUrl) {
        return '<div style="margin-top:4px"><span style="opacity:0.6;font-size:11px">No media</span></div>';
      }
      var img = '<img src="' + mediaUrl + '" alt="" loading="lazy" style="display:block;width:100%;max-width:200px;height:120px;object-fit:cover;object-position:center;border-radius:4px;margin-top:6px" />';
      // Attribution and license always render on their own line each (never
      // joined inline) — a shared wrapping line breaks at a different point
      // depending on content length, which reads as inconsistent spacing
      // between popups.
      var attributionLine = '<div style="margin-top:4px;font-size:10px;opacity:0.7;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">' + (mediaAttribution || '&nbsp;') + '</div>';
      var licenseInner = mediaLicense
        ? (mediaLicenseUrl
            ? '<a href="' + mediaLicenseUrl + '" target="_blank" rel="noopener noreferrer" data-open-external-url="true">' + mediaLicense + '</a>'
            : mediaLicense)
        : '&nbsp;';
      var licenseLine = '<div style="margin-top:2px;font-size:10px;opacity:0.7;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">' + licenseInner + '</div>';
      return img + attributionLine + licenseLine;
    }

    // Top-level (not inside map.on('load', ...)) since handleParentMessage
    // (below) can receive SELECTED_POINT_MESSAGE_TYPE at any time — reads
    // map/OCCURRENCE_POINTS defensively, matching refreshOccurrenceMarkerColors.
    var selectedPointPopup = null;
    // Mirrors whatever point React last told us to select — kept
    // independent of selectedPointPopup (which gets torn down and rebuilt
    // on every reapply) so applyPendingPointStyleUpdates can refresh the
    // popup's baked-in HTML after a variable switch instead of leaving it
    // frozen at the value/color it had when first selected.
    var lastAppliedSelectedPoint = null;
    // The ad-hoc popup opened by map.on('click') below for a background
    // (non-observation) point — tracked so a variable switch can refresh
    // its content in place via refreshBackgroundPointPopup, the same way
    // lastAppliedSelectedPoint lets applySelectedPoint re-run for the
    // observation-pin case.
    var lastBackgroundPopup = null;

    function clearSelectedPoint() {
      var source = map.getSource('selected-point');
      if (source) {
        source.setData({ type: 'FeatureCollection', features: [] });
      }
      if (selectedPointPopup) {
        selectedPointPopup.remove();
        selectedPointPopup = null;
      }
    }

    function applySelectedPoint(point) {
      lastAppliedSelectedPoint = point || null;
      clearSelectedPoint();
      if (!point || typeof point.latitude !== 'number' || typeof point.longitude !== 'number') {
        return;
      }

      var source = map.getSource('selected-point');
      if (source) {
        source.setData({
          type: 'FeatureCollection',
          features: [{
            type: 'Feature',
            geometry: { type: 'Point', coordinates: [point.longitude, point.latitude] },
            properties: {},
          }],
        });
      }

      // Mirrors Leaflet's matchingEntry lookup: prefer an exact catalog
      // match (known when selecting from the observation gallery) over
      // lat/lon proximity, which is the only option for the map-click
      // "point:" flow (no catalogNumber).
      var matchingPt = point.catalogNumber
        ? OCCURRENCE_POINTS.find(function(pt) { return pt.popupCatalogValue === point.catalogNumber; })
        : null;
      if (!matchingPt) {
        matchingPt = OCCURRENCE_POINTS.find(function(pt) {
          return Math.abs(pt.latitude - point.latitude) < 1e-6 && Math.abs(pt.longitude - point.longitude) < 1e-6;
        });
      }
      if (!matchingPt) {
        // A background pin restored via applySelectedPoint (e.g. on load,
        // from a hydrated ?highlightObservation=point:<lat>,<lon> URL)
        // otherwise only ever drew the selected-point source dot above —
        // unlike a live map.on('click') on the same spot, which also opens
        // a popup and fetches its value. Do the same here so a reloaded
        // background pin looks identical to one just clicked.
        if (POINT_QUERY_URL) {
          selectedPointPopup = new maplibregl.Popup({ closeButton: true, focusAfterOpen: false })
            .setLngLat([point.longitude, point.latitude])
            .setHTML('<span style="opacity:0.6;font-size:11px">Loading…</span>')
            .addTo(map);
          lastBackgroundPopup = selectedPointPopup;
          fetchBackgroundPointPopup(selectedPointPopup, point.latitude, point.longitude);
        }
        return;
      }

      var html = '';
      if (LINK_OBSERVATIONS && matchingPt.popupCatalogHref && matchingPt.popupCatalogLabel) {
        html += '<a href="https://www.inaturalist.org/observations/' + matchingPt.popupCatalogHref + '" target="_blank" rel="noopener noreferrer" data-open-external-url="true">Observation #' + matchingPt.popupCatalogLabel + '</a>';
      } else if (matchingPt.popupCatalogLabel) {
        html += '<span>Observation #' + matchingPt.popupCatalogLabel + '</span>';
      }
      html += buildMarkerValueHtml({
        varValue: matchingPt.varValue,
        varColor: matchingPt.varColor,
        varLabel: matchingPt.varLabel,
      });
      if (matchingPt.popupCatalogLabel) {
        html += buildObservationMediaHtml(matchingPt.popupMediaUrl, matchingPt.popupMediaAttribution, matchingPt.popupMediaLicense, matchingPt.popupMediaLicenseUrl);
      }
      // focusAfterOpen defaults to true — calling .focus() on the popup DOM

    // Basemap mode toggle — 3 distinct looks, cycling standard -> satellite
    // -> variable -> standard: (1) standard self-hosted tiles only, (2) Esri
    // satellite tiles only, (3) the exact same setup as maps.tsx — standard
    // self-hosted tiles with the currently-selected GIS variable's translucent
    // heatmap overlay on top. The overlay is ONLY visible in mode 3; modes
    // 1/2 explicitly hide it even if a variable happens to be selected, so
    // it never shows up uninvited on top of satellite. Same live-locally /
    // persist-via-postMessage split as the terrain toggle above. Guarded
    // the same way TERRAIN_TILE_URL guards the terrain control above.
    if (SATELLITE_TILE_URL) {
      var currentBasemapMode = INITIAL_BASEMAP_MODE;
      // One fixed icon for all 3 states (a per-mode icon looked ambiguous —
      // the 'standard' glyph was identical to the neighboring "switch to 2D
      // view" button's icon) — only the tooltip text and the highlight
      // color change, same as every other toggle control here.
      var BASEMAP_MODE_ICON = '<svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round" stroke-linecap="round"><path d="M8 1.5L14.5 5 8 8.5 1.5 5z"/><path d="M1.5 8L8 11.5 14.5 8"/><path d="M1.5 11L8 14.5 14.5 11"/></svg>';
      var BASEMAP_MODE_TITLES = {
        standard: 'Switch to satellite basemap',
        satellite: 'Switch to variable overlay',
        variable: 'Switch to standard basemap',
      };
      var applyBasemapMode = function(mode) {
        var source = map.getSource('basemap');
        if (source && typeof source.setTiles === 'function') {
          source.setTiles([tileUrlForBasemapMode(mode)]);
        }
        if (map.getLayer('heatmap-layer')) {
          map.setLayoutProperty('heatmap-layer', 'visibility', mode === 'variable' ? 'visible' : 'none');
        }
        if (map.getLayer('labels-layer')) {

          // 'standard'/'variable' both have labels baked into their own

        // The standard-theme toggle button (defined below, only when
        // STANDARD_THEMES has more than one entry) only makes sense in

        // Guarded with typeof since applyBasemapMode's first call runs

        if (typeof updateStandardThemeVisibility === 'function') { updateStandardThemeVisibility(); }

      };
      map.addControl({
        onAdd: function() {

        },
        onRemove: function() {},

      // Cycles the 'standard' mode's own look, N-way over STANDARD_THEMES
      // (currently 2: default/versatiles, but nothing here assumes that) —
      // a second, independent axis from the 3-way mode toggle above. Only
      // built at all when STANDARD_THEMES has more than one entry (nothing
      // to cycle to otherwise) — mirrors SATELLITE_TILE_URL's gating on the
      // outer if — and only ever visible while currentBasemapMode ===
      // 'standard' (see updateStandardThemeVisibility, called from
      // applyBasemapMode above).
      if (STANDARD_THEMES && STANDARD_THEMES.length > 1) {
        var STANDARD_THEME_ICON = '<svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round" stroke-linecap="round"><path d="M8 1.5c-3.6 0-6.5 2.6-6.5 5.8 0 2 1.4 3.2 3 3.2h.6c.5 0 .9.4.9.9 0 .3-.1.5-.3.7-.3.3-.5.7-.5 1.1 0 .9.8 1.3 1.5 1.3 3.9 0 7.3-3 7.3-6.7 0-3.5-2.9-6.3-6-6.3z"/><circle cx="5" cy="6.2" r="0.9" fill="currentColor" stroke="none"/><circle cx="8" cy="4.7" r="0.9" fill="currentColor" stroke="none"/><circle cx="11" cy="6.2" r="0.9" fill="currentColor" stroke="none"/><circle cx="6.5" cy="9" r="0.9" fill="currentColor" stroke="none"/></svg>';
        var standardThemeContainer = null;
        var updateStandardThemeVisibility = function() {
          if (standardThemeContainer) { standardThemeContainer.style.display = currentBasemapMode === 'standard' ? '' : 'none'; }
        };
        // Index-based cycle over STANDARD_THEMES rather than a hardcoded
        // 2-way ternary — works for any list length.
        var nextStandardTheme = function(theme) {
          var i = -1;

          }

        };

          onAdd: function() {

            };

    // Region-filter regions (see SpeciesOccurrenceMap.html for the
    // hand-drawn version) — globe/MapLibre only supports uploading a
    // GeoJSON region for now, not clicking one out point by point (no
    // drawing-toolbar plugin wired up here yet). Each uploaded file's
    // polygons become one group, matching Leaflet's grouping, so the
    // eraser control removes a whole upload at a time. The `polygonDrawn`/
    // `polygonCleared` messages posted below are the exact same contract
    // SpeciesOccurrenceMap.html uses — SpeciesOccurrenceMap.tsx and
    // everything upstream of it (region filtering, the backend `polygon`
    // query param) doesn't know or care which renderer sent them.
    var drawnPolygonGroups = [];

    function allDrawnPolygonPoints() {
      var allRings = [];
      drawnPolygonGroups.forEach(function(group) {
        group.forEach(function(ring) { allRings.push(ring); });
      });
      return allRings;
    }

    function rebuildDrawnPolygonsSource() {
      var source = map.getSource('drawn-polygons');
      if (!source) return;
      var features = [];
      drawnPolygonGroups.forEach(function(group) {
        group.forEach(function(ring) {
          features.push({
            type: 'Feature',
            properties: {},
            // GeoJSON is [lon, lat] and needs the ring closed (first point
            // repeated at the end); ring here is [lat, lon] pairs, open —
            // same convention used everywhere else in this file's message
            // contract (see allDrawnPolygonPoints).
            geometry: {
              type: 'Polygon',
              coordinates: [
                ring.map(function(pt) { return [pt[1], pt[0]]; }).concat([[ring[0][1], ring[0][0]]]),
              ],
            },
          });
        });
      });
      source.setData({ type: 'FeatureCollection', features: features });
    }

    var eraserControlInstance = null;
    function updateEraserControlVisibility() {
      var shouldShow = drawnPolygonGroups.length > 0;
      var isShown = eraserControlInstance != null;
      if (shouldShow && !isShown) {
        eraserControlInstance = {
          onAdd: function() {
            var container = document.createElement('div');
            container.className = 'maplibregl-ctrl maplibregl-ctrl-group';
            var btn = document.createElement('button');
            btn.type = 'button';
            btn.style.cssText = 'display:flex;align-items:center;justify-content:center;';
            btn.title = 'Erase most recently uploaded region';
            btn.innerHTML = '<svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round" stroke-linecap="round"><path d="M10.5 1.5l4 4-7 7h-4v-4z"/><path d="M3.5 12.5h9"/></svg>';
            btn.addEventListener('click', function() {
              drawnPolygonGroups.pop();
              rebuildDrawnPolygonsSource();
              updateEraserControlVisibility();
              if (drawnPolygonGroups.length > 0) {
                postToParent({ type: 'polygonDrawn', polygons: allDrawnPolygonPoints() });
              } else {
                postToParent({ type: 'polygonCleared' });
              }
            });
            container.appendChild(btn);
            return container;
          },
          onRemove: function() {},
        };
        map.addControl(eraserControlInstance);
      } else if (!shouldShow && isShown) {
        map.removeControl(eraserControlInstance);
        eraserControlInstance = null;
      }
    }

    // Mirrors SpeciesOccurrenceMap.html's extractPolygonRingsFromGeoJson —
    // kept as a hand-duplicated copy rather than shared, same as everything
    // else between these two standalone HTML documents (see
    // LEAFLET_RESIZE_OBSERVER_SCRIPT's doc comment in
    // speciesOccurrenceMapHelpers.ts for why the Leaflet/Leaflet-offline
    // pair shares snippets via placeholder but Leaflet/Globe don't — the
    // two renderers' surrounding code has nothing else in common to hang a
    // shared snippet off of).
    function extractPolygonRingsFromGeoJson(geojson) {
      var rings = [];
      function fromGeometry(geometry) {
        if (!geometry) return;
        if (geometry.type === 'Polygon') {
          var outer = geometry.coordinates && geometry.coordinates[0];
          if (outer && outer.length >= 3) {
            rings.push(outer.map(function(c) { return [c[1], c[0]]; }));
          }
        } else if (geometry.type === 'MultiPolygon') {
          (geometry.coordinates || []).forEach(function(poly) {
            var outer = poly && poly[0];
            if (outer && outer.length >= 3) {
              rings.push(outer.map(function(c) { return [c[1], c[0]]; }));
            }
          });
        } else if (geometry.type === 'GeometryCollection') {
          (geometry.geometries || []).forEach(fromGeometry);
        }
      }
      if (!geojson) return rings;
      if (geojson.type === 'FeatureCollection') {
        (geojson.features || []).forEach(function(f) { fromGeometry(f && f.geometry); });
      } else if (geojson.type === 'Feature') {
        fromGeometry(geojson.geometry);
      } else {
        fromGeometry(geojson);
      }
      return rings;
    }

    function showUploadPolygonError(message) {
      new maplibregl.Popup({ closeButton: true })
        .setLngLat(map.getCenter())
        .setHTML('<span style="font-size:12px">' + message + '</span>')
        .addTo(map);
    }

    function handleUploadedGeoJsonFile(file) {
      var reader = new FileReader();
      reader.onload = function() {
        var rings;
        try {
          rings = extractPolygonRingsFromGeoJson(JSON.parse(String(reader.result)));
        } catch (err) {
          showUploadPolygonError('Could not read that file as GeoJSON.');
          return;
        }
        if (!rings.length) {
          showUploadPolygonError('No polygon regions found in that file.');
          return;
        }
        drawnPolygonGroups.push(rings);
        rebuildDrawnPolygonsSource();
        updateEraserControlVisibility();
        postToParent({ type: 'polygonDrawn', polygons: allDrawnPolygonPoints() });
      };
      reader.onerror = function() {
        showUploadPolygonError('Could not read that file.');
      };
      reader.readAsText(file);
    }

    map.addControl({
      onAdd: function() {
        var container = document.createElement('div');
        container.className = 'maplibregl-ctrl maplibregl-ctrl-group';
        var btn = document.createElement('button');
        btn.type = 'button';
        btn.style.cssText = 'display:flex;align-items:center;justify-content:center;';
        btn.title = 'Upload a GeoJSON region';
        btn.innerHTML = '<svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"><path d="M8 10.5V2.5"/><path d="M4.5 6L8 2.5L11.5 6"/><path d="M2.5 10.5v2a1 1 0 0 0 1 1h9a1 1 0 0 0 1-1v-2"/></svg>';
        var fileInput = document.createElement('input');
        fileInput.type = 'file';
        fileInput.accept = '.geojson,.json,application/geo+json,application/json';
        fileInput.style.display = 'none';
        document.body.appendChild(fileInput);
        fileInput.addEventListener('change', function(event) {
          var file = event.target.files && event.target.files[0];
          fileInput.value = '';
          if (file) handleUploadedGeoJsonFile(file);
        });
        btn.addEventListener('click', function() {
          fileInput.click();
        });
        container.appendChild(btn);
        return container;
      },
      onRemove: function() {},
    });

    // "Auto-adapt": rescales the legend/colorization to just the value

    // catalog-wide render_min/render_max — a ruler, since it's about
    // measuring the data that's currently in view. This button doesn't
    // track its own on/off state — it's a dumb trigger that posts a click
    // upward and waits for AUTO_ADAPT_ENABLED to round-trip back down via
    // 'heatmapUpdate' (see updateAutoAdaptButton), so there's only ever one
    // source of truth for whether it's on.
    var autoAdaptButtonEl = null;
    var autoAdaptContainerEl = null;
    function updateAutoAdaptButton() {

      // it — otherwise an empty bordered box would still show up in the
      // stack when the variable isn't a numeric gradient.

      autoAdaptButtonEl.style.color = AUTO_ADAPT_ENABLED ? palette.linkColor : '';

      map.addControl({
        onAdd: function() {
          var container = document.createElement('div');
          container.className = 'maplibregl-ctrl maplibregl-ctrl-group';
          var btn = document.createElement('button');
          btn.type = 'button';
          btn.style.cssText = 'display:flex;align-items:center;justify-content:center;';
          btn.innerHTML = '<svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"><rect x="1.5" y="5.5" width="13" height="5" rx="0.5"/><path d="M4.5 5.5v2M7.5 5.5v2M10.5 5.5v2M13 5.5v1.3"/></svg>';
          btn.addEventListener('click', function() {
            postToParent({ type: 'toggleAutoAdapt' });
          });
          container.appendChild(btn);
          autoAdaptButtonEl = btn;
          autoAdaptContainerEl = container;

          return container;
        },
        onRemove: function() {},
      });
    }

    // Theme MapLibre's built-in controls (zoom/compass/geolocate/fullscreen,
    // attribution) to match the app's actual light/dark palette — mirrors
    // SpeciesOccurrenceMap.html's injectThemeCss(), adapted to MapLibre's
    // control class names. MapLibre's control icons are baked-in black SVG
    // background-images (not currentColor-based), so simple text-color rules
    // can't recolor them the way Leaflet's glyph-based locate button can —
    // inverting them is the standard workaround for a dark background.
    (function injectThemeCss() {
      var bg = palette.surfaceBackground;
      var text = palette.surfaceText;
      var link = palette.linkColor;
      var bdr = palette.surfaceBorder;
      var iconFilter = MAP_TILE_MODE === 'dark' ? 'invert(1)' : 'none';
      var css = [
        '.maplibregl-ctrl-group{background:' + bg + ' !important;border:1px solid ' + bdr + '}',
        '.maplibregl-ctrl-group button{background:transparent;color:' + text + '}',
        '.maplibregl-ctrl-group button + button{border-top:1px solid ' + bdr + '}',
        '.maplibregl-ctrl-group button:not(:disabled):hover{background-color:' + bdr + '}',
        '.maplibregl-ctrl-icon,.maplibregl-ctrl-attrib-button{filter:' + iconFilter + '}',
        '.maplibregl-ctrl-attrib{background:' + bg + ' !important;color:' + text + '}',
        '.maplibregl-ctrl-attrib a{color:' + link + ' !important}',
        '.maplibregl-ctrl-scale{background:' + bg + ' !important;color:' + text + ';border-color:' + text + '}',
        // MapLibre stacks same-corner controls in a vertical column by
        // default (float+clear:both) — tall enough at bottom-left to run
        // under the left-side legend overlay the consuming page renders
        // there. Force a horizontal row instead so the scale bar and
        // attribution sit side by side, in DOM/add order (scale, then
        // attribution — see the addControl() calls above).

        '.maplibregl-ctrl-bottom-left .maplibregl-ctrl{float:none !important;clear:none !important;margin:0 0 10px 10px !important}',
        '.maplibregl-ctrl-scale.wherewild-scale-centered{position:fixed !important;top:50% !important;left:50% !important;right:auto !important;bottom:auto !important;margin:0 !important;transform:translate(-50%,-50%);z-index:2000}',
        '.maplibregl-popup-content{background:' + bg + ';color:' + text + '}',
        '.maplibregl-popup-content a,.maplibregl-popup-content a:visited{color:' + link + ' !important}',

        '.maplibregl-user-location-dot::before{background-color:' + palette.markerFill + '}',
        '.maplibregl-user-location-accuracy-circle{background-color:' + palette.markerFill + '}',
      ].join('');
      var el = document.createElement('style');
      el.textContent = css;
      document.head.appendChild(el);
    })();

    let mapReady = false;

    function formatPointValueHtml(numVal, units) {
      var isNumeric = (DOT_MIN != null && DOT_MAX != null && DOT_MAX >= DOT_MIN)
        || (RENDER_MIN != null && RENDER_MAX != null && RENDER_MAX >= RENDER_MIN);
      var colorMin = DOT_MIN != null ? DOT_MIN : RENDER_MIN;
      var colorMax = DOT_MAX != null ? DOT_MAX : RENDER_MAX;
      if (IS_CIRCULAR) {
        var color = aspectColor(numVal);
        var fmt = numVal.toLocaleString(undefined, { maximumFractionDigits: 1 });
        return '<div style="display:flex;align-items:center"><span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:' + color + ';margin-right:5px"></span><span>' + fmt + '°</span></div>';
      }
      if (isNumeric && colorMin != null && colorMax != null && colorMax >= colorMin) {
        var t = safeT(numVal, colorMin, colorMax);
        var color = gradientColor(t);
        var fmt = Math.abs(numVal) >= 1000 ? numVal.toLocaleString(undefined, { maximumFractionDigits: 0 }) : numVal.toLocaleString(undefined, { maximumFractionDigits: 2 });
        return '<div style="display:flex;align-items:center"><span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:' + color + ';margin-right:5px"></span><span>' + fmt + (units ? ' ' + units : '') + '</span></div>';
      }
      var classKey = String(Math.round(numVal));
      var classColor = CLASS_COLORS && CLASS_COLORS[classKey];
      var classLabel = (CLASS_LABELS && CLASS_LABELS[classKey]) || classKey;
      var dot = classColor ? '<span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:' + classColor + ';margin-right:5px"></span>' : '';
      return '<div style="display:flex;align-items:center">' + dot + '<span>' + classLabel + '</span></div>';
    }

    function sendPinMessage(catalogNumber, latitude, longitude) {
      postToParent({ type: PIN_OBSERVATION_MESSAGE_TYPE, catalogNumber: catalogNumber, latitude: latitude, longitude: longitude });
    }

    map.on('load', function() {
      mapReady = true;
      if (typeof map.setProjection === 'function') {
        map.setProjection({ type: 'globe' });
      }
      applyPendingHeatmapUpdate();

      if (typeof window.glMatrix !== 'undefined') {
        try {
          map.addLayer(createStarfieldLayer(SPACE_PRESET), 'background');
        } catch (e) {
          // Non-essential visual flourish — a missing WebGL feature or a
          // failed gl-matrix load shouldn't take down the rest of the map.
        }
      }

      if (SHOW_MARKERS && Array.isArray(points) && points.length) {
        var validPoints = points.filter(function(pt) {
          return typeof pt.latitude === 'number' && typeof pt.longitude === 'number';
        });

        OCCURRENCE_POINTS = validPoints;

        try {

        // Plain/shaped marker layer pair, parameterized by source id so the
        // exact same paint/layout gets reused for both the always-present
        // "individual mode" source and (when clustering is active) the
        // clustered source's own unclustered leaf points — a cluster of
        // points too sparse to merge at the current zoom still needs to
        // render as normal markers, same as a lone marker inside a Leaflet
        // clusterGroup does.
        function addOccurrencePointLayers(sourceId, idSuffix, extraFilter) {
          var plainFilter = ['!', ['get', 'hasShape']];
          var shapeFilter = ['get', 'hasShape'];
          map.addLayer({
            id: 'occurrences' + idSuffix + '-layer',
            type: 'circle',
            source: sourceId,
            filter: extraFilter ? ['all', extraFilter, plainFilter] : plainFilter,
            paint: {
              'circle-radius': 5,
              'circle-color': ['get', 'markerColor'],
              'circle-stroke-color': ['get', 'markerStroke'],
              'circle-stroke-width': ['case', ['boolean', ['get', 'isNodata'], false], 1, MARKER_OUTLINE ? 2 : 1],
              'circle-opacity': ['case', ['boolean', ['get', 'isNodata'], false], 0.5, 0.9],
            },
          });
          map.addLayer({
            id: 'occurrences' + idSuffix + '-shapes-layer',
            type: 'symbol',
            source: sourceId,
            filter: extraFilter ? ['all', extraFilter, shapeFilter] : shapeFilter,
            layout: {
              'icon-image': ['get', 'iconKey'],
              'icon-size': 1,
              'icon-allow-overlap': true,
              'icon-ignore-placement': true,
            },
            paint: {
              'icon-opacity': ['case', ['boolean', ['get', 'isNodata'], false], 0.5, 0.9],
            },
          });
        }

        // Mirrors Leaflet's useVisibilityManagedClustering: below the
        // threshold, points render individually with no clustering at all,
        // full stop — no second source, no dynamic mode-switching needed.
        // Above it, both modes exist and MODE is re-evaluated on every
        // moveend (see updateClusterMode) based on how many points are
        // currently inside the viewport, not the total dataset size —
        // matching Leaflet's shouldShowVisibleIndividuals check exactly.
        // clusterRadius matches leaflet.markercluster's default
        // maxClusterRadius (80px); clusterMaxZoom is left high (Leaflet
        // doesn't set disableClusteringAtZoom either) so clustering keeps
        // applying all the way in — clusters only stop forming once points
        // are naturally farther apart than the radius at that zoom.
        var useClustering = validPoints.length > MAX_VISIBLE_UNCLUSTERED_OBSERVATIONS;

        map.addSource('occurrences', {
          type: 'geojson',
          data: buildOccurrenceFeatureCollection(validPoints),
          cluster: false,
        });
        addOccurrencePointLayers('occurrences', '', null);

        if (useClustering) {
          map.addSource('occurrences-clustered', {
            type: 'geojson',
            data: buildOccurrenceFeatureCollection(validPoints),
            cluster: true,
            clusterMaxZoom: 24,
            clusterRadius: 80,
          });
          addOccurrencePointLayers('occurrences-clustered', '-clustered', ['!', ['has', 'point_count']]);
          map.addLayer({
            id: CLUSTER_LAYER_ID,
            type: 'circle',
            source: 'occurrences-clustered',
            filter: ['has', 'point_count'],
            paint: {
              'circle-radius': ['step', ['get', 'point_count'], 14, 10, 18, 100, 24],
              // Themed via palette.markerFill (the app's brand/green token,
              // same one plain markers use) rather than a hardcoded color —
              // larger clusters get progressively more opaque instead of a
              // different hue, so the whole cluster UI stays one color.
              'circle-color': palette.markerFill,
              'circle-opacity': ['step', ['get', 'point_count'], 0.75, 10, 0.85, 100, 0.95],
              'circle-stroke-color': '#fff',
              'circle-stroke-width': 2,
            },
          });
          map.addLayer({
            id: CLUSTER_COUNT_LAYER_ID,
            type: 'symbol',
            source: 'occurrences-clustered',
            filter: ['has', 'point_count'],
            layout: {
              'text-field': ['get', 'point_count_abbreviated'],
              'text-font': ['Open Sans Bold', 'Arial Unicode MS Bold'],
              'text-size': 12,
              'text-allow-overlap': true,
              'text-ignore-placement': true,
            },
            paint: {
              'text-color': '#fff',
            },
          });
        }

        OCCURRENCE_LAYERS = [
          { id: 'occurrences-layer', baseFilter: ['!', ['get', 'hasShape']] },
          { id: 'occurrences-shapes-layer', baseFilter: ['get', 'hasShape'] },
        ];
        if (useClustering) {
          OCCURRENCE_LAYERS.push(
            { id: 'occurrences-clustered-layer', baseFilter: ['all', ['!', ['has', 'point_count']], ['!', ['get', 'hasShape']]] },
            { id: 'occurrences-clustered-shapes-layer', baseFilter: ['all', ['!', ['has', 'point_count']], ['get', 'hasShape']] }
          );
        }
        OCCURRENCE_LAYER_IDS = OCCURRENCE_LAYERS.map(function(l) { return l.id; });
        ALL_MARKER_LAYER_IDS = OCCURRENCE_LAYER_IDS.concat(useClustering ? [CLUSTER_LAYER_ID, CLUSTER_COUNT_LAYER_ID] : []);

        // Highlight ring for a point selected via SELECTED_POINT_MESSAGE_TYPE
        // (e.g. clicking an observation in the below-map gallery) — mirrors
        // Leaflet's dashed selected-point marker. MapLibre circle layers
        // have no dash-pattern paint property, so this is a plain stroke
        // ring instead of a dashed one; visually distinct is what matters.
        map.addSource('selected-point', {
          type: 'geojson',
          data: { type: 'FeatureCollection', features: [] },
        });
        map.addLayer({
          id: 'selected-point-layer',
          type: 'circle',
          source: 'selected-point',
          paint: {
            'circle-radius': 7,
            'circle-color': 'transparent',
            'circle-stroke-color': palette.selectedPointStroke,
            'circle-stroke-width': 2,
          },
        });

        // Uploaded region filter(s) — see extractPolygonRingsFromGeoJson/
        // rebuildDrawnPolygonsSource above. Rendered as a normal fill+line
        // layer; MapLibre's globe projection curves this along the sphere
        // automatically like every other vector layer, no special handling
        // needed here for the 3D case.
        map.addSource('drawn-polygons', {
          type: 'geojson',
          data: { type: 'FeatureCollection', features: [] },
        });
        map.addLayer({
          id: 'drawn-polygons-fill-layer',
          type: 'fill',
          source: 'drawn-polygons',
          paint: {
            'fill-color': palette.markerFill,
            'fill-opacity': 0.12,
          },
        });
        map.addLayer({
          id: 'drawn-polygons-line-layer',
          type: 'line',
          source: 'drawn-polygons',
          paint: {
            'line-color': palette.markerFill,
            'line-width': 2,
          },
        });

        if (INITIAL_DRAWN_POLYGONS && INITIAL_DRAWN_POLYGONS.length > 0) {
          // One group per ring (not all lumped into one) so the eraser
          // control can remove them one at a time, matching hand-drawn
          // shapes on Leaflet — the grouping a file upload would have had
          // doesn't survive the round trip through React's flat polygon
          // list, so this is the closest equivalent.
          drawnPolygonGroups = INITIAL_DRAWN_POLYGONS.map(function(ring) { return [ring]; });
          rebuildDrawnPolygonsSource();
          updateEraserControlVisibility();
        }

        var INDIVIDUAL_MODE_LAYER_IDS = ['occurrences-layer', 'occurrences-shapes-layer'];
        var CLUSTERED_MODE_LAYER_IDS = ['occurrences-clustered-layer', 'occurrences-clustered-shapes-layer', CLUSTER_LAYER_ID, CLUSTER_COUNT_LAYER_ID];

        function setMarkerMode(mode) {
          var showIndividual = mode === 'individual';
          INDIVIDUAL_MODE_LAYER_IDS.forEach(function(id) {
            map.setLayoutProperty(id, 'visibility', showIndividual ? 'visible' : 'none');
          });
          CLUSTERED_MODE_LAYER_IDS.forEach(function(id) {
            map.setLayoutProperty(id, 'visibility', showIndividual ? 'none' : 'visible');
          });
        }

        // bounds.contains is a reasonable approximation for the deep-zoom
        // views this actually matters for; it isn't antimeridian-exact at
        // extreme zoomed-out globe angles, but at that scale the visible
        // count is always far above the threshold anyway (clustered mode),
        // so any imprecision there is inconsequential.
        function updateClusterMode() {
          if (!useClustering) return;
          var bounds = map.getBounds();
          var visibleCount = 0;
          for (var i = 0; i < validPoints.length; i++) {
            if (bounds.contains([validPoints[i].longitude, validPoints[i].latitude])) visibleCount++;
          }
          var wantIndividual = visibleCount > 0 && visibleCount <= MAX_VISIBLE_UNCLUSTERED_OBSERVATIONS;
          setMarkerMode(wantIndividual ? 'individual' : 'clustered');
        }
        if (useClustering) {
          map.on('moveend', updateClusterMode);
        }

        // Unlike Leaflet (which always fits the view to the observation
        // points when there are any), the globe otherwise just opens at the
        // fixed default center/zoom — meaning real occurrence data could be
        // sitting anywhere on the sphere, off-screen, looking like there
        // are no markers at all. map.fitBounds() is deliberately NOT used
        // here — MapLibre has several open bugs around bounds-fitting
        // specifically under globe projection (e.g. maxBounds not being
        // respected, camera fitting behaving oddly), so instead of trusting
        // its globe-aware camera math, the center/zoom are computed here
        // with plain arithmetic and applied directly. Extracted into a
        // function so replaceOccurrencePoints (below) can reposition the
        // same way when occurrences itself changes (location/phenology
        // filter), not just at initial load.
        function positionMapForOccurrencePoints(pointsList) {
          if (!pointsList.length) return;
          var minLng = pointsList[0].longitude, maxLng = pointsList[0].longitude;
          var minLat = pointsList[0].latitude, maxLat = pointsList[0].latitude;
          var sumLng = 0, sumLat = 0;
          pointsList.forEach(function(pt) {
            if (pt.longitude < minLng) minLng = pt.longitude;
            if (pt.longitude > maxLng) maxLng = pt.longitude;
            if (pt.latitude < minLat) minLat = pt.latitude;
            if (pt.latitude > maxLat) maxLat = pt.latitude;
            sumLng += pt.longitude;
            sumLat += pt.latitude;
          });
          var centerLng = sumLng / pointsList.length;
          var centerLat = sumLat / pointsList.length;
          var lngSpan = Math.max(maxLng - minLng, 0.02);
          var latSpan = Math.max(maxLat - minLat, 0.02);
          // Rough "which zoom level would this span fit at" table — doesn't
          // need to be exact, just needs to reliably land on-screen.
          var span = Math.max(lngSpan, latSpan);
          var fitZoom =
            span > 170 ? 1 :
            span > 90 ? 2 :
            span > 45 ? 3 :
            span > 22 ? 4 :
            span > 11 ? 5 :
            span > 6 ? 6 :
            span > 3 ? 7 :
            span > 1.5 ? 8 :
            span > 0.75 ? 9 :
            span > 0.35 ? 10 :
            span > 0.18 ? 11 :
            span > 0.09 ? 12 :
            13;
          var zoom = Math.max(CUSTOM_MIN_ZOOM, fitZoom);
          if (CUSTOM_MAX_ZOOM !== null) zoom = Math.min(zoom, CUSTOM_MAX_ZOOM);
          map.jumpTo({ center: [centerLng, centerLat], zoom: zoom });
        }
        positionMapForOccurrencePoints(validPoints);

        replaceOccurrencePointsImpl = function(newPoints) {
          var validNewPoints = newPoints.filter(function(pt) {
            return typeof pt.latitude === 'number' && typeof pt.longitude === 'number';
          });
          OCCURRENCE_POINTS = validNewPoints;
          var source = map.getSource('occurrences');
          if (source) {
            // Unlike refreshOccurrenceMarkerColors, always setData here
            // (even when empty) — a filter matching zero results must
            // still clear whatever's currently shown, not leave it stale.
            var collection = buildOccurrenceFeatureCollection(validNewPoints);
            source.setData(collection);
            var clusteredSource = map.getSource('occurrences-clustered');
            if (clusteredSource) clusteredSource.setData(collection);
          }
          positionMapForOccurrencePoints(validNewPoints);
        };

        function handleOccurrenceMarkerClick(e) {
          var feature = e.features && e.features[0];
          if (!feature) return;
          // Without this, the generic map-level click handler below (used
          // for empty-map point queries) also fires for this same click —
          // MapLibre doesn't stop propagation to it automatically the way
          // Leaflet does for marker clicks — producing a second, unwanted
          // "background point" popup right alongside the observation one.
          e.preventDefault();
          var props = feature.properties;
          var lngLat = feature.geometry.coordinates;
          if (ALLOW_PIN_OBSERVATIONS && props.catalog) {
            sendPinMessage(props.catalog, lngLat[1], lngLat[0]);
          }
          var html = '';
          if (LINK_OBSERVATIONS && props.catalogHref && props.catalogLabel) {
            html += '<a href="https://www.inaturalist.org/observations/' + props.catalogHref + '" target="_blank" rel="noopener noreferrer" data-open-external-url="true">Observation #' + props.catalogLabel + '</a>';
          } else if (props.catalogLabel) {
            html += '<span>Observation #' + props.catalogLabel + '</span>';
          }
          if (props.varValue != null) {
            postToParent({ type: 'pointValue', value: props.varValue });
          }
          // Always build the value html, not just when varValue is
          // non-null — buildMarkerValueHtml already renders "No data" for a
          // genuinely nodata observation (matches Leaflet's
          // buildObservationValueHtml, called unconditionally there for the
          // same reason). Guarding this call on varValue != null skipped
          // that branch entirely, so a nodata marker's popup silently
          // omitted the "No data" line instead of showing it.
          html += buildMarkerValueHtml({
            varValue: props.varValue,
            varColor: props.rawVarColor,
            varLabel: props.varLabel,
          });
          if (props.catalogLabel) {
            html += buildObservationMediaHtml(props.mediaUrl, props.mediaAttribution, props.mediaLicense, props.mediaLicenseUrl);
          }
          new maplibregl.Popup({ closeButton: true }).setLngLat(lngLat).setHTML(html || '&nbsp;').addTo(map);
        }

        OCCURRENCE_LAYER_IDS.forEach(function(layerId) {
          map.on('click', layerId, handleOccurrenceMarkerClick);
        });

        function handleClusterClick(e) {
          var feature = e.features && e.features[0];
          if (!feature) return;
          e.preventDefault();
          var clusterId = feature.properties.cluster_id;
          map.getSource('occurrences-clustered').getClusterExpansionZoom(clusterId, function(err, zoom) {
            if (err) return;
            map.easeTo({ center: feature.geometry.coordinates, zoom: zoom });
          });
        }
        map.on('click', CLUSTER_LAYER_ID, handleClusterClick);
        map.on('click', CLUSTER_COUNT_LAYER_ID, handleClusterClick);

        ALL_MARKER_LAYER_IDS.forEach(function(layerId) {
          map.on('mouseenter', layerId, function() { map.getCanvas().style.cursor = 'pointer'; });
          map.on('mouseleave', layerId, function() { map.getCanvas().style.cursor = ''; });
        });
        applyPendingHighlights();
        // Set the initial individual-vs-clustered mode now that the camera
        // is in its final position (see updateClusterMode/jumpTo above) —
        // subsequent re-evaluation happens on 'moveend'.
        updateClusterMode();

        } catch (markerError) {
          console.error('Error while adding occurrence markers:', markerError);
        }
      }

      applyPendingPointStyleUpdates();
      postBounds();
      scheduleRefreshVisibleTileClasses();
    });

    // Fetches POINT_QUERY_URL for a background (non-observation) click and
    // renders the result into an already-open popup. Split out of
    // map.on('click') below so refreshBackgroundPointPopup can re-run the
    // exact same rendering after a variable switch, instead of duplicating
    // this logic.
    function fetchBackgroundPointPopup(popup, latitude, longitude) {
      fetch(POINT_QUERY_URL + '&lat=' + latitude + '&lon=' + longitude)
        .then(function(r) { return r.ok ? r.json() : Promise.reject(r.status); })
        .then(function(data) {
          if (!popup.isOpen()) return;
          if (data.value == null) {
            popup.setHTML('<span style="opacity:0.6;font-size:11px">No data</span>');
            return;
          }
          var numVal = Number(data.value);
          if (isFinite(numVal)) {
            postToParent({ type: 'pointValue', value: numVal });
            if (data.class_name || data.class_color) {
              var classKey = String(Math.round(numVal));
              var resolvedClassColor = (CLASS_COLORS && CLASS_COLORS[classKey]) || data.class_color || null;
              var dot = resolvedClassColor
                ? '<span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:' + resolvedClassColor + ';margin-right:5px;flex-shrink:0"></span>'
                : '';
              var label = data.class_name || String(numVal);
              popup.setHTML('<div style="display:flex;align-items:center;font-size:12px;max-width:180px">' + dot + '<span>' + label + '</span></div>');
            } else {
              popup.setHTML(formatPointValueHtml(numVal, data.units || VAR_UNITS));
            }
          }
        })
        .catch(function() {
          if (popup.isOpen()) popup.setHTML('<span style="opacity:0.6;font-size:11px">Offline</span>');
        });
    }

    // Re-fetches and re-renders the currently open background-point popup
    // (if any) at its existing position — called alongside
    // applySelectedPoint(lastAppliedSelectedPoint) whenever the selected
    // variable changes, so a background pin's value/color stays live the
    // same way an observation pin's does. No-op if no background popup is
    // open (e.g. an observation marker's popup is showing instead, or
    // nothing is selected).
    function refreshBackgroundPointPopup() {
      if (!lastBackgroundPopup || !lastBackgroundPopup.isOpen() || !POINT_QUERY_URL) return;
      var lngLat = lastBackgroundPopup.getLngLat();
      if (!lngLat) return;
      fetchBackgroundPointPopup(lastBackgroundPopup, lngLat.lat, lngLat.lng);
    }

    map.on('click', function(event) {
      if (event.defaultPrevented) return;
      // event.defaultPrevented alone isn't reliable here — query directly
      // instead of trusting it propagated from the layer-specific handler.
      if (occurrenceLayersExist()) {
        var hits = map.queryRenderedFeatures(event.point, { layers: ALL_MARKER_LAYER_IDS });
        if (hits && hits.length) return;
      }
      var latitude = event.lngLat.lat;
      var longitude = event.lngLat.lng;

      if (LOCATION_PICKER_MODE) {
        var container = document.createElement('div');
        container.style.cssText = 'display:flex;flex-direction:column;align-items:center;gap:8px;padding:2px 0;';
        var label = document.createElement('span');
        label.style.cssText = 'font-size:13px;font-weight:600;';
        label.textContent = 'Set home region?';
        var btn = document.createElement('button');
        btn.textContent = 'Confirm';
        btn.style.cssText = 'padding:4px 14px;border-radius:4px;border:none;cursor:pointer;font-size:12px;font-weight:600;background:' + palette.markerFill + ';color:#fff;';
        container.appendChild(label);
        container.appendChild(btn);
        var picker = new maplibregl.Popup({ closeButton: true }).setLngLat(event.lngLat).setDOMContent(container).addTo(map);
        btn.addEventListener('click', function() {
          postToParent({ type: 'locationPicked', lat: latitude, lon: longitude });
          picker.remove();
        });
        return;
      }

      if (POINT_QUERY_URL) {
        if (ALLOW_PIN_OBSERVATIONS) {
          sendPinMessage('point:' + latitude.toFixed(6) + ',' + longitude.toFixed(6), latitude, longitude);
        }
        var popup = new maplibregl.Popup({ closeButton: true })
          .setLngLat(event.lngLat)
          .setHTML('<span style="opacity:0.6;font-size:11px">Loading…</span>')
          .addTo(map);
        lastBackgroundPopup = popup;
        fetchBackgroundPointPopup(popup, latitude, longitude);
        return;
      }

      if (ALLOW_PIN_OBSERVATIONS) {
        sendPinMessage('point:' + latitude.toFixed(6) + ',' + longitude.toFixed(6), latitude, longitude);
      }
    });

    document.addEventListener('click', function(event) {
      var externalLink = event.target && typeof event.target.closest === 'function'
        ? event.target.closest('[data-open-external-url="true"]')
        : null;
      if (!externalLink) return;
      var url = externalLink.getAttribute('href');
      if (!url) return;
      // Ctrl/Cmd/middle/Shift-click all signal "open in a background tab" —
      // the anchor already has target="_blank" and a real href, so letting
      // the browser handle those natively (instead of preventDefault + our
      // own postToParent -> Linking.openURL bridge) means no new window/tab
      // ever takes focus away from this document, which is what was
      // kicking the parent page out of fullscreen on every link click even
      // when the click was only ever meant to open in the background.
      if (event.ctrlKey || event.metaKey || event.shiftKey || event.button === 1) return;
      event.preventDefault();
      postToParent({ type: OPEN_EXTERNAL_URL_MESSAGE_TYPE, url: url });
    });

    function postBounds() {
      var b = map.getBounds();
      postToParent({ type: 'mapBounds', north: b.getNorth(), south: b.getSouth(), east: b.getEast(), west: b.getWest() });
      var z = Math.round(map.getZoom());
      var n = Math.pow(2, z);
      function tile(lat, lon) {
        var x = Math.floor((lon + 180) / 360 * n);
        var latRad = lat * Math.PI / 180;
        var y = Math.floor((1 - Math.log(Math.tan(latRad) + 1 / Math.cos(latRad)) / Math.PI) / 2 * n);
        return { x: Math.max(0, Math.min(n - 1, x)), y: Math.max(0, Math.min(n - 1, y)) };
      }
      var nw = tile(b.getNorth(), b.getWest());
      var se = tile(b.getSouth(), b.getEast());
      postToParent({ type: 'tilesChanged', z: z, x0: nw.x, y0: nw.y, x1: se.x, y1: se.y });
    }
    map.on('moveend', postBounds);
    map.on('moveend', scheduleRefreshVisibleTileClasses);
    map.on('zoomend', scheduleRefreshVisibleTileClasses);
    map.on('idle', scheduleRefreshVisibleTileClasses);

    // Even though the 'heatmap' source is defined in the style object we
    // hand to the Map constructor, MapLibre still needs a brief async
    // moment to parse that style before map.getSource('heatmap') returns
    // anything — a heatmapUpdate message arriving in that window (racing
    // against React's own iframe-onLoad-based readiness signal, which is a
    // different, earlier event than MapLibre's internal 'load') would
    // otherwise just get silently dropped with nothing to retry it. Instead
    // of gating on any particular readiness check, always remember the
    // latest desired URL and (re)try applying it — on receipt, and again
    // once the map has definitely finished loading — so it's eventually
    // applied no matter how the timing falls.
    var pendingHeatmapUrl = null;
    function applyPendingHeatmapUpdate() {
      if (pendingHeatmapUrl == null) return;
      // Tracked independent of whether the 'heatmap' overlay source below
      // exists yet (it only ever gets created when HEATMAP_TILE_URL was
      // already truthy at page load) — the basemap-mode toggle's
      // nextBasemapMode uses this to decide whether 'variable' mode is
      // reachable at all, regardless of that.
      currentHeatmapTileUrl = pendingHeatmapUrl;
      var source = map.getSource('heatmap');
      if (!source) { pendingHeatmapUrl = null; return; }
      resetTileClassTracking();
      source.setTiles(['heatmap://' + pendingHeatmapUrl]);
      scheduleRefreshVisibleTileClasses();
      pendingHeatmapUrl = null;
    }

    // Same race as pendingHeatmapUrl above: a pointStylesUpdate can arrive
    // (React's iframe-onLoad readiness fires) before MapLibre's own async
    // 'load' event has populated OCCURRENCE_POINTS. Remember the latest
    // batch and retry on both receipt and once the map has definitely
    // finished loading, instead of silently dropping it.
    var pendingPointStyleUpdates = null;
    function applyPendingPointStyleUpdates() {
      if (!pendingPointStyleUpdates || !OCCURRENCE_POINTS.length) return;
      var pointStyleUpdates = new Map();
      pendingPointStyleUpdates.forEach(function(entry) {
        if (entry && entry.catalog) pointStyleUpdates.set(entry.catalog, entry);
      });
      OCCURRENCE_POINTS.forEach(function(pt) {
        var update = pointStyleUpdates.get(pt.popupCatalogValue);
        if (!update) return;
        pt.varValue = update.varValue != null ? update.varValue : null;
        pt.varColor = update.varColor || null;
        pt.varLabel = update.varLabel || null;
        pt.varShape = update.varShape || null;
      });
      refreshOccurrenceMarkerColors();
      // The dot color refreshes for free via setData above (OCCURRENCE_POINTS
      // was just mutated in place), but a selected point's popup HTML was
      // baked once when applySelectedPoint first ran — reapply so its value/
      // color reflect the new variable too, matching Leaflet's equivalent fix.
      applySelectedPoint(lastAppliedSelectedPoint);
      refreshBackgroundPointPopup();
      pendingPointStyleUpdates = null;
    }

    function handleParentMessage(payload) {
      var data = payload;
      if (typeof payload === 'string') {
        try { data = JSON.parse(payload); } catch (e) { return; }
      }
      if (!data || !data.type) return;

      if (data.type === HIGHLIGHT_MESSAGE_TYPE) {
        applyHighlights(data.catalogs);
        return;
      }

      if (data.type === SELECTED_POINT_MESSAGE_TYPE) {
        applySelectedPoint(data.point || null);
        return;
      }

      if (data.type === 'heatmapUpdate') {
        // Tile/legend-only concerns — the marker color SCALE (dotMin/
        // dotMax/isCircular/classColors/classLabels/gradientStops/
        // aspectStops) travels with pointStylesUpdate below instead, so it
        // can never arrive out of sync with the per-point values it's
        // paired with.
        if (data.heatmapTileUrl != null) {
          pendingHeatmapUrl = data.heatmapTileUrl;
          applyPendingHeatmapUpdate();
        }
        if (data.pointQueryUrl !== undefined) POINT_QUERY_URL = data.pointQueryUrl;
        if (data.renderMin !== undefined) RENDER_MIN = data.renderMin;
        if (data.renderMax !== undefined) RENDER_MAX = data.renderMax;
        if (data.varUnits !== undefined) VAR_UNITS = data.varUnits;
        if (data.markerOutline !== undefined) MARKER_OUTLINE = data.markerOutline;
        if (data.autoAdaptApplicable !== undefined) AUTO_ADAPT_APPLICABLE = data.autoAdaptApplicable;
        if (data.autoAdaptEnabled !== undefined) AUTO_ADAPT_ENABLED = data.autoAdaptEnabled;
        updateAutoAdaptButton();
        return;
      }

      if (data.type === 'pointStylesUpdate') {
        // Recolors/reshapes already-rendered occurrence markers in place —
        // sent whenever the selected variable changes but the underlying
        // occurrences (positions) don't, so switching variables never has
        // to reload the whole map. Carries BOTH the color scale and the
        // per-point values in one message (see the effect that sends this
        // in SpeciesOccurrenceMap.tsx for why they're bundled together) —
        // scale globals are applied first, then per-point values via
        // applyPendingPointStyleUpdates, so a single repaint never sees a
        // mismatched combination of the two. Matched by catalog number
        // against the same OCCURRENCE_POINTS array buildOccurrenceFeature
        // reads from; setData() on refreshOccurrenceMarkerColors() below
        // picks up the mutated fields automatically (hasShape/iconKey
        // included).
        if (data.dotMin !== undefined) DOT_MIN = data.dotMin;
        if (data.dotMax !== undefined) DOT_MAX = data.dotMax;
        if (data.isCircular !== undefined) IS_CIRCULAR = data.isCircular;
        if (data.classColors !== undefined) CLASS_COLORS = data.classColors;
        if (data.classLabels !== undefined) CLASS_LABELS = data.classLabels;
        if (Array.isArray(data.gradientStops) && data.gradientStops.length > 0) GRADIENT_STOPS = data.gradientStops;
        if (Array.isArray(data.aspectStops) && data.aspectStops.length > 0) ASPECT_STOPS = data.aspectStops;
        if (Array.isArray(data.points)) {
          pendingPointStyleUpdates = data.points;
          applyPendingPointStyleUpdates();
        }
        return;
      }

      if (data.type === 'pointsUpdate') {
        // occurrences itself changed (location/phenology filter refetch, or
        // the upload page's offline client-side filter) — a genuinely
        // different set of points, not just new colors for the same ones.
        // See replaceOccurrencePointsImpl. Unlike pointStylesUpdate, an
        // empty array is meaningful here (filter matched nothing) and must
        // still clear whatever's currently shown.
        if (Array.isArray(data.points)) {
          replaceOccurrencePoints(data.points);
        }
        return;
      }
    }

    window.addEventListener('message', function(event) { handleParentMessage(event.data); });
    document.addEventListener('message', function(event) { handleParentMessage(event.data); });
  </script>
</body>

</html>
