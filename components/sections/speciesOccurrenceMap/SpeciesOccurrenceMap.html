<!DOCTYPE html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="referrer" content="__REFERRER_POLICY__" />
    <base href="__DOCUMENT_BASE_URL__" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css" />
    <style>
      html,
      body,
      #map {
        height: 100%;
        width: 100%;
        margin: 0;
        padding: 0;
      }

      #debug-panel {
        position: absolute;
        top: 8px;
        left: 8px;
        z-index: 1000;
        background: rgba(0, 0, 0, 0.65);
        color: #ffffff;
        font: 12px/1.2 -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        padding: 6px 8px;
        border-radius: 4px;
        pointer-events: none;
        max-width: 280px;
      }
    </style>
  </head>
  <body>
    <div id="map"></div>
    <div id="debug-panel" aria-live="polite">Heatmap debug: overlay disabled</div>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
    <script>
      const points = __POINTS_JSON__;
      const palette = __PALETTE_JSON__;
      const speciesKey = __SPECIES_KEY_JSON__;
      const heatmapPolicy = __HEATMAP_POLICY_JSON__;
      const HIGHLIGHT_MESSAGE_TYPE = __HIGHLIGHT_MESSAGE_TYPE_JSON__;
      const HEATMAP_FETCH_MESSAGE_TYPE = __HEATMAP_FETCH_MESSAGE_TYPE_JSON__;
      const HEATMAP_DATA_MESSAGE_TYPE = __HEATMAP_DATA_MESSAGE_TYPE_JSON__;
      const HEATMAP_ERROR_MESSAGE_TYPE = __HEATMAP_ERROR_MESSAGE_TYPE_JSON__;
      const HEATMAP_SETTINGS_MESSAGE_TYPE = __HEATMAP_SETTINGS_MESSAGE_TYPE_JSON__;

      const MERCATOR_MAX_LAT = 85.05112878;
      const TILE_SIZE = 256;
      const BASE_MIN_ZOOM = 2;
      const MAX_LONGITUDE_BOUND = 1000000000;
      const TILE_REFERRER_POLICY = __REFERRER_POLICY_JSON__;
      const TILE_URL = __TILE_URL_JSON__;
      const TILE_ATTRIBUTION = __TILE_ATTRIBUTION_JSON__;
      const TILE_MAX_ZOOM = __TILE_MAX_ZOOM__;
      const MAX_VISIBLE_UNCLUSTERED_OBSERVATIONS = __MAX_VISIBLE_UNCLUSTERED_OBSERVATIONS__;
      const HEATMAP_TILE_URL = __HEATMAP_TILE_URL_JSON__;
      const HEATMAP_OPACITY = __HEATMAP_OPACITY__;
      const CUSTOM_MIN_ZOOM = __MIN_ZOOM__;
      const SHOW_MARKERS = __SHOW_MARKERS__;
      const HEATMAP_DEBOUNCE_MS = Number(heatmapPolicy && heatmapPolicy.debounceMs) || 320;
      const HEATMAP_QUERY_PRECISION = Number(heatmapPolicy && heatmapPolicy.queryPrecision) || 4;
      const HEATMAP_MAX_CELLS = Number(heatmapPolicy && heatmapPolicy.maxCells) || 250000;
      const HEATMAP_FEATURE_MODE =
        (heatmapPolicy && heatmapPolicy.featureMode) ||
        'auto';
      const HEATMAP_ZOOM_RESOLUTION_BREAKPOINTS =
        (heatmapPolicy && Array.isArray(heatmapPolicy.zoomResolutionBreakpoints)
          ? heatmapPolicy.zoomResolutionBreakpoints
          : []);
      const mapBounds = L.latLngBounds(
        [[-MERCATOR_MAX_LAT, -MAX_LONGITUDE_BOUND], [MERCATOR_MAX_LAT, MAX_LONGITUDE_BOUND]],
      );
      const debugPanel = document.getElementById('debug-panel');

      let heatmapOverlayEnabled = false;
      let heatmapOverlayMode = 'cells';
      let heatmapTileUrl = '';
      let heatmapTileLayer = null;
      let heatmapTileLoadCount = 0;
      let activeSpeciesKey = speciesKey;

      function clampLatitude(value) {
        return Math.max(-MERCATOR_MAX_LAT, Math.min(MERCATOR_MAX_LAT, Number(value)));
      }

      function alignLongitudeToView(value, anchorLongitude) {
        const numeric = Number(value);
        const anchor = Number(anchorLongitude);
        if (!isFinite(numeric) || !isFinite(anchor)) {
          return numeric;
        }
        const worldOffset = Math.round((anchor - numeric) / 360);
        return numeric + worldOffset * 360;
      }

      function minZoomForMaxLongitudeSpan(sizeX) {
        const width = Number(sizeX);
        if (!isFinite(width) || width <= 0) {
          return Math.max(BASE_MIN_ZOOM, CUSTOM_MIN_ZOOM);
        }
        return Math.max(BASE_MIN_ZOOM, CUSTOM_MIN_ZOOM, Math.log2(width / TILE_SIZE));
      }

      function setDebugText(lines) {
        if (!debugPanel) {
          return;
        }
        debugPanel.textContent = Array.isArray(lines) && lines.length
          ? lines.join(' | ')
          : 'Heatmap debug: unavailable';
      }

      function summarizeTileUrl(url) {
        if (typeof url !== 'string' || !url.trim()) {
          return 'tileUrl=none';
        }
        try {
          const parsed = new URL(url, document.baseURI);
          return `tileUrl=${parsed.origin}${parsed.pathname}`;
        } catch {
          return `tileUrl=${url}`;
        }
      }

      function shouldDelegateHeatmapFetchToParent() {
        return typeof window !== 'undefined' && Boolean(window.parent) && window.parent !== window;
      }

      function roundQueryValue(value) {
        return Number(value).toFixed(HEATMAP_QUERY_PRECISION);
      }

      function resolutionForZoom(zoom) {
        if (!HEATMAP_ZOOM_RESOLUTION_BREAKPOINTS.length) {
          return 0.25;
        }
        for (let index = 0; index < HEATMAP_ZOOM_RESOLUTION_BREAKPOINTS.length; index += 1) {
          const breakpoint = HEATMAP_ZOOM_RESOLUTION_BREAKPOINTS[index];
          if (Number(zoom) >= Number(breakpoint.minZoom)) {
            return Number(breakpoint.resolution) || 0.25;
          }
        }
        return Number(HEATMAP_ZOOM_RESOLUTION_BREAKPOINTS.at(-1).resolution) || 0.25;
      }

      function parseHexColor(value) {
        if (typeof value !== 'string') {
          return null;
        }
        const normalized = value.trim().replace('#', '');
        if (!/^[\da-fA-F]{6}$/.test(normalized)) {
          return null;
        }
        return {
          red: parseInt(normalized.slice(0, 2), 16),
          green: parseInt(normalized.slice(2, 4), 16),
          blue: parseInt(normalized.slice(4, 6), 16),
        };
      }

      function heatmapColorForScore(score) {
        const low = parseHexColor(palette.heatmapLow);
        const high = parseHexColor(palette.heatmapHigh);
        const t = Math.max(0, Math.min(1, Number(score) || 0));
        if (!low || !high) {
          return {
            fill: palette.heatmapHigh,
            opacity: 0.2 + t * 0.6,
          };
        }
        const mix = (start, end) => Math.round(start + (end - start) * t);
        return {
          fill: `rgb(${mix(low.red, high.red)}, ${mix(low.green, high.green)}, ${mix(low.blue, high.blue)})`,
          opacity: 0.2 + t * 0.6,
        };
      }

      function summarizeHeatmapSources(cells) {
        const counts = new Map();
        (Array.isArray(cells) ? cells : []).forEach((cell) => {
          const rawSource = typeof cell.source === 'string' ? cell.source.trim() : '';
          const sourceKey = rawSource || 'unknown';
          counts.set(sourceKey, (counts.get(sourceKey) || 0) + 1);
        });
        if (!counts.size) {
          return 'sources=none';
        }
        return `sources=${Array.from(counts.entries())
          .sort((left, right) => right[1] - left[1] || left[0].localeCompare(right[0]))
          .map(([key, count]) => `${key}:${count}`)
          .join(',')}`;
      }

      const map = L.map('map', {
        maxBounds: mapBounds,
        maxBoundsViscosity: 1,
        minZoom: BASE_MIN_ZOOM,
        worldCopyJump: true,
      });

      function applyMinZoomForSize() {
        map.setMinZoom(minZoomForMaxLongitudeSpan(map.getSize().x));
      }

      applyMinZoomForSize();
      map.on('resize', () => {
        applyMinZoomForSize();
        scheduleHeatmapRefresh();
      });

      const tileLayer = L.tileLayer(TILE_URL, {
        attribution: TILE_ATTRIBUTION,
        maxZoom: TILE_MAX_ZOOM,
        referrerPolicy: TILE_REFERRER_POLICY,
      });

      const originalCreateTile = tileLayer.createTile;
      tileLayer.createTile = function(coords, done) {
        const tile = originalCreateTile.call(this, coords, done);
        tile.referrerPolicy = TILE_REFERRER_POLICY;
        return tile;
      };
      tileLayer.addTo(map);

      if (HEATMAP_TILE_URL) {
        L.tileLayer(HEATMAP_TILE_URL, {
          opacity: HEATMAP_OPACITY,
          tileSize: 256,
          maxZoom: TILE_MAX_ZOOM,
        }).addTo(map);
      }

      const markerStyle = {
        radius: 4,
        fillColor: palette.markerFill,
        color: palette.markerStroke,
        weight: 1,
        opacity: 0.9,
        fillOpacity: 0.9,
      };
      const highlightStyle = {
        radius: 5,
        fillColor: palette.highlightFill,
        color: palette.highlightStroke,
        weight: 1,
        opacity: 0.95,
        fillOpacity: 0.95,
      };
      const markers = new Map();
      const heatmapLayerGroup = L.layerGroup().addTo(map);
      let heatmapRequestCounter = 0;
      let heatmapDebounceTimer = null;
      let heatmapLastAppliedQueryKey = '';
      let heatmapAccumulatedCells = [];
      let heatmapAccumulatedRequestId = null;

      function drawHeatmapCells(cells, resolution, clearFirst) {
        if (clearFirst) {
          heatmapLayerGroup.clearLayers();
        }
        const halfCell = Math.max(Number(resolution) || 0, 0.001) / 2;
        const centerLongitude = map.getCenter().lng;
        (Array.isArray(cells) ? cells : []).forEach((cell) => {
          const latitude = Number(cell.lat);
          const longitude = Number(cell.lon);
          const score = Number(cell.score);
          if (!isFinite(latitude) || !isFinite(longitude) || !isFinite(score) || score <= 0) {
            return;
          }
          const alignedLongitude = alignLongitudeToView(longitude, centerLongitude);
          const color = heatmapColorForScore(score);
          L.rectangle(
            [
              [latitude - halfCell, alignedLongitude - halfCell],
              [latitude + halfCell, alignedLongitude + halfCell],
            ],
            {
              stroke: false,
              fillColor: color.fill,
              fillOpacity: color.opacity,
            },
          ).addTo(heatmapLayerGroup);
        });
      }

      function sendHeatmapRequestToParent(payload) {
        if (!shouldDelegateHeatmapFetchToParent()) {
          setDebugText(['Heatmap debug: direct iframe fetch disabled']);
          return;
        }
        window.parent.postMessage(payload, '*');
      }

      function createHeatmapTileLayer(url) {
        heatmapTileLoadCount = 0;
        const overlayLayer = L.tileLayer(url, {
          opacity: 0.65,
          referrerPolicy: TILE_REFERRER_POLICY,
          zIndex: 350,
        });
        const originalCreateOverlayTile = overlayLayer.createTile;
        overlayLayer.createTile = function(coords, done) {
          const tile = originalCreateOverlayTile.call(this, coords, done);
          tile.referrerPolicy = TILE_REFERRER_POLICY;
          return tile;
        };
        overlayLayer.on('loading', () => {
          setDebugText([
            'Heatmap debug: tile overlay loading',
            summarizeTileUrl(url),
          ]);
        });
        overlayLayer.on('tileload', () => {
          heatmapTileLoadCount += 1;
        });
        overlayLayer.on('load', () => {
          setDebugText([
            'Heatmap debug: tile overlay loaded',
            `tiles=${heatmapTileLoadCount}`,
            summarizeTileUrl(url),
          ]);
        });
        overlayLayer.on('tileerror', (event) => {
          const coords = event && event.coords
            ? `z=${event.coords.z} x=${event.coords.x} y=${event.coords.y}`
            : 'tile=unknown';
          setDebugText([
            'Heatmap debug: tile overlay error',
            coords,
            summarizeTileUrl(url),
          ]);
        });
        return overlayLayer;
      }

      function clearHeatmapTileLayer() {
        if (!heatmapTileLayer) {
          return;
        }
        map.removeLayer(heatmapTileLayer);
        heatmapTileLayer = null;
      }

      function ensureHeatmapTileLayer(url) {
        if (!url) {
          clearHeatmapTileLayer();
          return;
        }
        if (heatmapTileLayer && heatmapTileUrl === url) {
          if (!map.hasLayer(heatmapTileLayer)) {
            heatmapTileLayer.addTo(map);
          }
          return;
        }

        clearHeatmapTileLayer();
        heatmapTileUrl = url;
        heatmapTileLayer = createHeatmapTileLayer(url).addTo(map);
      }

      function applyHeatmapDataFromParent(payload) {
        if (!payload || payload.type !== HEATMAP_DATA_MESSAGE_TYPE) {
          return;
        }
        if (heatmapOverlayMode !== 'cells') {
          return;
        }
        const requestId = Number(payload.requestId);
        if (!isFinite(requestId) || requestId !== heatmapRequestCounter) {
          return;
        }
        const cells = Array.isArray(payload.cells) ? payload.cells : [];
        const resolution = Number(payload.resolution) || resolutionForZoom(map.getZoom());
        if (!payload.append || heatmapAccumulatedRequestId !== requestId) {
          heatmapAccumulatedCells = cells.slice();
          heatmapAccumulatedRequestId = requestId;
        } else {
          heatmapAccumulatedCells = heatmapAccumulatedCells.concat(cells);
        }
        drawHeatmapCells(heatmapAccumulatedCells, resolution, true);
        heatmapLastAppliedQueryKey = String(payload.queryKey || heatmapLastAppliedQueryKey);
        setDebugText([
          'Heatmap debug: cells rendered',
          `count=${heatmapAccumulatedCells.length}`,
          `resolution=${roundQueryValue(resolution)}`,
          summarizeHeatmapSources(heatmapAccumulatedCells),
        ]);
      }

      function applyHeatmapErrorFromParent(payload) {
        if (!payload || payload.type !== HEATMAP_ERROR_MESSAGE_TYPE) {
          return;
        }
        if (heatmapOverlayMode !== 'cells') {
          return;
        }
        const requestId = Number(payload.requestId);
        if (!isFinite(requestId) || requestId !== heatmapRequestCounter) {
          return;
        }
        heatmapLayerGroup.clearLayers();
        heatmapAccumulatedCells = [];
        heatmapAccumulatedRequestId = null;
        setDebugText([
          'Heatmap debug: parent request error',
          String(payload.message || 'unknown error'),
        ]);
      }

      function refreshHeatmapGrid() {
        if (!heatmapOverlayEnabled || !activeSpeciesKey) {
          heatmapLayerGroup.clearLayers();
          clearHeatmapTileLayer();
          heatmapAccumulatedCells = [];
          heatmapAccumulatedRequestId = null;
          setDebugText(['Heatmap debug: overlay disabled']);
          return;
        }

        if (heatmapOverlayMode === 'tiles') {
          heatmapLayerGroup.clearLayers();
          heatmapAccumulatedCells = [];
          heatmapAccumulatedRequestId = null;

          if (!heatmapTileUrl) {
            clearHeatmapTileLayer();
            setDebugText(['Heatmap debug: tile overlay unavailable']);
            return;
          }

          setDebugText([
            'Heatmap debug: tile overlay requested',
            summarizeTileUrl(heatmapTileUrl),
          ]);
          ensureHeatmapTileLayer(heatmapTileUrl);
          return;
        }

        clearHeatmapTileLayer();

        const currentBounds = map.getBounds();
        const resolution = resolutionForZoom(map.getZoom());
        const query = {
          species_key: String(activeSpeciesKey),
          min_lat: roundQueryValue(currentBounds.getSouth()),
          min_lon: roundQueryValue(currentBounds.getWest()),
          max_lat: roundQueryValue(currentBounds.getNorth()),
          max_lon: roundQueryValue(currentBounds.getEast()),
          resolution: roundQueryValue(resolution),
          include_source: 'true',
          feature_mode: String(HEATMAP_FEATURE_MODE),
          max_cells: String(HEATMAP_MAX_CELLS),
        };
        const queryKey = Object.values(query).join('|');

        if (queryKey === heatmapLastAppliedQueryKey) {
          drawHeatmapCells(heatmapAccumulatedCells, resolution, true);
          setDebugText(['Heatmap debug: reused last query']);
          return;
        }

        const requestId = ++heatmapRequestCounter;
        drawHeatmapCells([], resolution, true);
        heatmapAccumulatedCells = [];
        heatmapAccumulatedRequestId = requestId;
        setDebugText([
          'Heatmap debug: delegated to parent fetch',
          `request=${requestId}`,
          `resolution=${query.resolution}`,
        ]);
        sendHeatmapRequestToParent({
          type: HEATMAP_FETCH_MESSAGE_TYPE,
          requestId,
          queryKey,
          query,
        });
      }

      function scheduleHeatmapRefresh() {
        if (heatmapDebounceTimer) {
          clearTimeout(heatmapDebounceTimer);
        }
        heatmapDebounceTimer = setTimeout(() => {
          refreshHeatmapGrid();
        }, HEATMAP_DEBOUNCE_MS);
      }

      function applyHighlights(list) {
        const highlightSet = new Set(
          Array.isArray(list) ? list.map((item) => String(item)) : [],
        );
        markers.forEach((marker, catalog) => {
          if (highlightSet.has(catalog)) {
            marker.setStyle(highlightStyle);
          } else {
            marker.setStyle(markerStyle);
          }
        });
      }

      function handleRuntimeMessage(payload) {
        let data = payload;
        if (typeof payload === 'string') {
          try {
            data = JSON.parse(payload);
          } catch {
            return;
          }
        }
        if (data && data.type === HIGHLIGHT_MESSAGE_TYPE) {
          applyHighlights(data.catalogs || []);
        }
        if (data && data.type === HEATMAP_DATA_MESSAGE_TYPE) {
          applyHeatmapDataFromParent(data);
        }
        if (data && data.type === HEATMAP_ERROR_MESSAGE_TYPE) {
          applyHeatmapErrorFromParent(data);
        }
        if (data && data.type === HEATMAP_SETTINGS_MESSAGE_TYPE) {
          heatmapOverlayEnabled = Boolean(data.enabled);
          heatmapOverlayMode = data.overlayMode === 'tiles' ? 'tiles' : 'cells';
          activeSpeciesKey = data.speciesKey ? String(data.speciesKey) : '';
          heatmapTileUrl = typeof data.tileUrl === 'string' ? data.tileUrl : '';
          heatmapLastAppliedQueryKey = '';
          setDebugText([
            'Heatmap debug: settings received',
            `enabled=${heatmapOverlayEnabled}`,
            `mode=${heatmapOverlayMode}`,
            summarizeTileUrl(heatmapTileUrl),
          ]);
          scheduleHeatmapRefresh();
        }
      }

      document.addEventListener('message', (event) => handleRuntimeMessage(event.data));
      window.addEventListener('message', (event) => handleRuntimeMessage(event.data));

      if (SHOW_MARKERS && Array.isArray(points) && points.length) {
        const observedBounds = [];
        const directMarkerAnchors = [];
        const markerEntries = [];
        const useVisibilityManagedClustering =
          points.length > MAX_VISIBLE_UNCLUSTERED_OBSERVATIONS;
        const clusterGroup = useVisibilityManagedClustering
          ? L.markerClusterGroup({
              spiderfyOnMaxZoom: false,
              chunkedLoading: true,
              chunkInterval: 120,
              chunkDelay: 20,
            })
          : null;
        const visibleMarkerLayer = useVisibilityManagedClustering ? L.layerGroup() : null;
        let showingVisibleIndividualMarkers = !useVisibilityManagedClustering;

        function buildObservationPopup(catalogHref, catalogLabel) {
          if (!catalogHref || !catalogLabel) {
            return '';
          }
          return (
            '<a href="https://www.inaturalist.org/observations/' + catalogHref + '" target="_blank" rel="noopener noreferrer">Observation #' + catalogLabel + '</a>'
          );
        }

        function applyEntryStyle(entry, style) {
          entry.clusterMarker?.setStyle(style);
          entry.directMarker?.setStyle(style);
        }

        function visibleEntriesForCurrentView(centerLongitude) {
          const currentBounds = map.getBounds();
          const visibleEntries = [];
          markerEntries.forEach((entry) => {
            const alignedLongitude = alignLongitudeToView(entry.longitude, centerLongitude);
            if (currentBounds.contains(L.latLng(entry.latitude, alignedLongitude))) {
              visibleEntries.push({ entry, alignedLongitude });
            }
          });
          return visibleEntries;
        }

        function ensureVisibleDirectMarker(entry, alignedLongitude) {
          if (!visibleMarkerLayer) {
            return;
          }
          if (!entry.directMarker) {
            entry.directMarker = L.circleMarker([entry.latitude, alignedLongitude], markerStyle);
            if (entry.popupHtml) {
              entry.directMarker.bindPopup(entry.popupHtml);
            }
            visibleMarkerLayer.addLayer(entry.directMarker);
          } else {
            entry.directMarker.setLatLng([entry.latitude, alignedLongitude]);
          }
          entry.alignedLongitude = alignedLongitude;
        }

        function removeVisibleDirectMarker(entry) {
          if (!visibleMarkerLayer || !entry.directMarker) {
            return;
          }
          visibleMarkerLayer.removeLayer(entry.directMarker);
          entry.directMarker = null;
        }

        function syncDirectMarkersToCurrentWorld() {
          const centerLongitude = map.getCenter().lng;
          directMarkerAnchors.forEach((entry) => {
            const alignedLongitude = alignLongitudeToView(entry.longitude, centerLongitude);
            entry.marker.setLatLng([entry.latitude, alignedLongitude]);
            entry.alignedLongitude = alignedLongitude;
          });
        }

        function syncClusterMarkersToCurrentWorld() {
          if (!clusterGroup) {
            return false;
          }

          const centerLongitude = map.getCenter().lng;
          let changed = false;

          markerEntries.forEach((entry) => {
            const alignedLongitude = alignLongitudeToView(entry.longitude, centerLongitude);
            if (entry.alignedLongitude === alignedLongitude) {
              return;
            }

            entry.clusterMarker.setLatLng([entry.latitude, alignedLongitude]);
            entry.alignedLongitude = alignedLongitude;
            changed = true;
          });

          return changed;
        }

        function rebuildClusterGroupIfNeeded() {
          if (!clusterGroup || showingVisibleIndividualMarkers) {
            return;
          }

          if (!syncClusterMarkersToCurrentWorld()) {
            return;
          }

          map.removeLayer(clusterGroup);
          clusterGroup.addTo(map);
        }

        function refreshVisibleMarkerPresentation() {
          if (!useVisibilityManagedClustering || !clusterGroup || !visibleMarkerLayer) {
            syncDirectMarkersToCurrentWorld();
            return;
          }

          const centerLongitude = map.getCenter().lng;
          const visibleEntries = visibleEntriesForCurrentView(centerLongitude);
          const shouldShowVisibleIndividuals =
            visibleEntries.length > 0 &&
            visibleEntries.length <= MAX_VISIBLE_UNCLUSTERED_OBSERVATIONS;

          if (shouldShowVisibleIndividuals) {
            if (!showingVisibleIndividualMarkers) {
              map.removeLayer(clusterGroup);
              visibleMarkerLayer.addTo(map);
              showingVisibleIndividualMarkers = true;
            }

            const visibleKeys = new Set();
            visibleEntries.forEach(({ entry, alignedLongitude }) => {
              visibleKeys.add(entry.key);
              ensureVisibleDirectMarker(entry, alignedLongitude);
            });

            markerEntries.forEach((entry) => {
              if (!visibleKeys.has(entry.key)) {
                removeVisibleDirectMarker(entry);
              }
            });
            return;
          }

          markerEntries.forEach(removeVisibleDirectMarker);
          if (showingVisibleIndividualMarkers) {
            map.removeLayer(visibleMarkerLayer);
            clusterGroup.addTo(map);
            showingVisibleIndividualMarkers = false;
          }

          rebuildClusterGroupIfNeeded();
        }

        points.forEach((pt, idx) => {
          if (typeof pt.latitude !== 'number' || typeof pt.longitude !== 'number') {
            return;
          }

          const latitude = clampLatitude(pt.latitude);
          const canonicalLongitude = Number(pt.longitude);
          if (!isFinite(latitude) || !isFinite(canonicalLongitude)) {
            return;
          }

          const initialLongitude = alignLongitudeToView(canonicalLongitude, 0);
          const catalog = pt.catalogNumber ? String(pt.catalogNumber) : '';
          const markerKey = catalog.length ? catalog : 'fallback-' + String(idx);
          const popupHtml = buildObservationPopup(pt.popupCatalogHref, pt.popupCatalogLabel);

          if (useVisibilityManagedClustering && clusterGroup) {
            const clusterMarker = L.circleMarker([latitude, initialLongitude], markerStyle);
            if (popupHtml) {
              clusterMarker.bindPopup(popupHtml);
            }

            const markerEntry = {
              key: markerKey,
              latitude,
              longitude: canonicalLongitude,
              alignedLongitude: initialLongitude,
              popupHtml,
              clusterMarker,
              directMarker: null,
            };

            clusterGroup.addLayer(clusterMarker);
            markerEntries.push(markerEntry);
            markers.set(markerKey, {
              setStyle(style) {
                applyEntryStyle(markerEntry, style);
              },
            });
          } else {
            const marker = L.circleMarker([latitude, initialLongitude], markerStyle);
            if (popupHtml) {
              marker.bindPopup(popupHtml);
            }
            map.addLayer(marker);
            directMarkerAnchors.push({
              marker,
              latitude,
              longitude: canonicalLongitude,
              alignedLongitude: initialLongitude,
            });
            markers.set(markerKey, marker);
          }

          observedBounds.push([latitude, initialLongitude]);
        });

        if (useVisibilityManagedClustering && clusterGroup) {
          map.addLayer(clusterGroup);
        }

        if (observedBounds.length) {
          map.fitBounds(observedBounds, { padding: [20, 20] });
        } else {
          map.setView([0, 0], BASE_MIN_ZOOM);
        }

        map.on('moveend', () => {
          refreshVisibleMarkerPresentation();
          scheduleHeatmapRefresh();
        });
        map.on('zoomend', () => {
          refreshVisibleMarkerPresentation();
          scheduleHeatmapRefresh();
        });
        refreshVisibleMarkerPresentation();
      } else {
        map.setView([0, 0], BASE_MIN_ZOOM);
      }

      applyHighlights([]);
      scheduleHeatmapRefresh();
    </script>
  </body>
</html>
