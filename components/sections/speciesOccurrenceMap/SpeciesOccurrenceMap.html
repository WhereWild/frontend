<!DOCTYPE html>
<html>

<head>
  <meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no" />
  <meta name="referrer" content="__REFERRER_POLICY__" />
  <base href="__DOCUMENT_BASE_URL__" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css" />
  <style>
    html,
    body,
    #map {
      height: 100%;
      width: 100%;
      margin: 0;
      padding: 0;
    }
  </style>
</head>

<body>
  <div id="map"></div>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
  <script>
    const points = __POINTS_JSON__;
    const palette = __PALETTE_JSON__;
    const HIGHLIGHT_MESSAGE_TYPE = __HIGHLIGHT_MESSAGE_TYPE_JSON__;
    const PIN_OBSERVATION_MESSAGE_TYPE = __PIN_OBSERVATION_MESSAGE_TYPE_JSON__;
    const SELECTED_POINT_MESSAGE_TYPE = __SELECTED_POINT_MESSAGE_TYPE_JSON__;
    const OPEN_EXTERNAL_URL_MESSAGE_TYPE = __OPEN_EXTERNAL_URL_MESSAGE_TYPE_JSON__;

    const MERCATOR_MAX_LAT = 85.05112878;
    const TILE_SIZE = 256;
    const BASE_MIN_ZOOM = 2;
    const MAX_LONGITUDE_BOUND = 1000000000;
    const TILE_REFERRER_POLICY = __REFERRER_POLICY_JSON__;
    const TILE_URL = __TILE_URL_JSON__;
    const TILE_ATTRIBUTION = __TILE_ATTRIBUTION_JSON__;
    const TILE_MAX_ZOOM = __TILE_MAX_ZOOM__;
    const MAX_VISIBLE_UNCLUSTERED_OBSERVATIONS = __MAX_VISIBLE_UNCLUSTERED_OBSERVATIONS__;
    const HEATMAP_TILE_URL = __HEATMAP_TILE_URL_JSON__;
    const HEATMAP_OPACITY = __HEATMAP_OPACITY__;
    const CUSTOM_MIN_ZOOM = __MIN_ZOOM__;
    const CUSTOM_MAX_ZOOM = __MAX_ZOOM__;
    const INITIAL_LAT = __INITIAL_LAT__;
    const INITIAL_LON = __INITIAL_LON__;
    const INITIAL_ZOOM = __INITIAL_ZOOM__;
    const SHOW_MARKERS = __SHOW_MARKERS__;
    const ALLOW_PIN_OBSERVATIONS = __ALLOW_PIN_OBSERVATIONS__;
    const LINK_OBSERVATIONS = __LINK_OBSERVATIONS__;
    const POINT_QUERY_URL = __POINT_QUERY_URL_JSON__;
    const IS_CIRCULAR = __IS_CIRCULAR__;
    const DOT_MIN = __DOT_MIN_JSON__;
    const DOT_MAX = __DOT_MAX_JSON__;
    const RENDER_MIN = __RENDER_MIN_JSON__;
    const RENDER_MAX = __RENDER_MAX_JSON__;
    const DISABLE_OBSERVATION_QUERY = __DISABLE_OBSERVATION_QUERY__;
    const VAR_UNITS = __VAR_UNITS_JSON__;

    var ASPECT_STOPS = __ASPECT_STOPS_JSON__;
    function aspectColor(deg) {
      var n = ASPECT_STOPS.length;
      var t = ((deg % 360) + 360) % 360 / 360;
      var fi = t * n;
      var i = Math.floor(fi) % n;
      var f = fi - Math.floor(fi);
      var c0 = ASPECT_STOPS[i], c1 = ASPECT_STOPS[(i + 1) % n];
      return 'rgb('+Math.round(c0[0]+f*(c1[0]-c0[0]))+','+Math.round(c0[1]+f*(c1[1]-c0[1]))+','+Math.round(c0[2]+f*(c1[2]-c0[2]))+')';
    }
    var GRADIENT_STOPS = __GRADIENT_STOPS_JSON__;
    function gradientColor(t) {
      var n = GRADIENT_STOPS.length - 1;
      var i = Math.min(Math.floor(t * n), n - 1);
      var f = t * n - i;
      var c0 = GRADIENT_STOPS[i], c1 = GRADIENT_STOPS[i + 1];
      return 'rgb(' + Math.round(c0[0]+f*(c1[0]-c0[0])) + ',' + Math.round(c0[1]+f*(c1[1]-c0[1])) + ',' + Math.round(c0[2]+f*(c1[2]-c0[2])) + ')';
    }
    const CUSTOM_MAX_BOUNDS = __MAX_BOUNDS_JSON__;
    const mapBounds = CUSTOM_MAX_BOUNDS
      ? L.latLngBounds(CUSTOM_MAX_BOUNDS[0], CUSTOM_MAX_BOUNDS[1])
      : L.latLngBounds(
          [[-MERCATOR_MAX_LAT, -MAX_LONGITUDE_BOUND], [MERCATOR_MAX_LAT, MAX_LONGITUDE_BOUND]],
        );

    function clampLatitude(value) {
      return Math.max(-MERCATOR_MAX_LAT, Math.min(MERCATOR_MAX_LAT, Number(value)));
    }

    function alignLongitudeToView(value, anchorLongitude) {
      const numeric = Number(value);
      const anchor = Number(anchorLongitude);
      if (!isFinite(numeric) || !isFinite(anchor)) {
        return numeric;
      }
      const worldOffset = Math.round((anchor - numeric) / 360);
      return numeric + worldOffset * 360;
    }

    function minZoomForMaxLongitudeSpan(sizeX) {
      const width = Number(sizeX);
      if (!isFinite(width) || width <= 0) {
        return Math.max(BASE_MIN_ZOOM, CUSTOM_MIN_ZOOM);
      }
      return Math.max(BASE_MIN_ZOOM, CUSTOM_MIN_ZOOM, Math.log2(width / TILE_SIZE));
    }

    const map = L.map('map', {
      maxBounds: mapBounds,
      maxBoundsViscosity: 1,
      minZoom: BASE_MIN_ZOOM,
      ...(CUSTOM_MAX_ZOOM !== null ? { maxZoom: CUSTOM_MAX_ZOOM } : {}),
      worldCopyJump: !CUSTOM_MAX_BOUNDS,
    });

    function applyMinZoomForSize() {
      map.setMinZoom(minZoomForMaxLongitudeSpan(map.getSize().x));
    }

    applyMinZoomForSize();
    map.on('resize', applyMinZoomForSize);

    const tileLayer = L.tileLayer(TILE_URL, {
      attribution: TILE_ATTRIBUTION,
      maxZoom: TILE_MAX_ZOOM,
      referrerPolicy: TILE_REFERRER_POLICY,
    });

    const originalCreateTile = tileLayer.createTile;
    tileLayer.createTile = function (coords, done) {
      const tile = originalCreateTile.call(this, coords, done);
      tile.referrerPolicy = TILE_REFERRER_POLICY;
      return tile;
    };
    tileLayer.addTo(map);

    function resolveTileUrl(template, coords) {
      return String(template)
        .replace('{z}', String(coords.z))
        .replace('{x}', String(coords.x))
        .replace('{y}', String(coords.y));
    }

    function supportsAbortableTileFetch() {
      return (
        typeof fetch === 'function'
        && typeof AbortController === 'function'
        && typeof URL !== 'undefined'
        && typeof URL.createObjectURL === 'function'
        && typeof URL.revokeObjectURL === 'function'
        && typeof document.createElement === 'function'
      );
    }

    function createAbortableHeatmapLayer(urlTemplate) {
      const layer = L.tileLayer(urlTemplate, {
        opacity: HEATMAP_OPACITY,
        tileSize: 256,
        maxZoom: TILE_MAX_ZOOM,
      });
      const controllers = new WeakMap();
      const objectUrls = new WeakMap();
      const tileClassData = new WeakMap();

      function postClassMessage(type, classes) {
        var msg = { type: type, classes: classes };
        if (window.ReactNativeWebView) {
          window.ReactNativeWebView.postMessage(JSON.stringify(msg));
        } else {
          // codeql[js/cross-window-information-leak] -- internal WebView iframe, loaded as blob URL so location.origin is "null"
          window.parent.postMessage(msg, '*');
        }
      }

      function releaseTile(tile) {
        const controller = controllers.get(tile);
        if (controller) {
          controller.abort();
          controllers.delete(tile);
        }
        const objectUrl = objectUrls.get(tile);
        if (objectUrl) {
          URL.revokeObjectURL(objectUrl);
          objectUrls.delete(tile);
        }
        const classes = tileClassData.get(tile);
        if (classes && classes.length > 0) {
          postClassMessage('tileClassesRemoved', classes);
          tileClassData.delete(tile);
        }
      }

      layer.on('tileunload', function(event) {
        if (event && event.tile) {
          releaseTile(event.tile);
        }
      });

      layer.createTile = function(coords, done) {
        const tile = document.createElement('img');
        const controller = new AbortController();
        let finished = false;

        function finish(error) {
          if (finished) {
            return;
          }
          finished = true;
          done(error || null, tile);
        }

        function revokeObjectUrl() {
          const objectUrl = objectUrls.get(tile);
          if (objectUrl) {
            URL.revokeObjectURL(objectUrl);
            objectUrls.delete(tile);
          }
        }

        controllers.set(tile, controller);
        tile.alt = '';
        tile.referrerPolicy = TILE_REFERRER_POLICY;
        tile.setAttribute('role', 'presentation');
        tile.onload = function() {
          revokeObjectUrl();
          controllers.delete(tile);
          finish(null);
        };
        tile.onerror = function(error) {
          revokeObjectUrl();
          controllers.delete(tile);
          if (controller.signal.aborted) {
            finish(null);
            return;
          }
          finish(error || new Error('Heatmap tile image load failed'));
        };

        fetch(resolveTileUrl(urlTemplate, coords), {
          signal: controller.signal,
          referrerPolicy: TILE_REFERRER_POLICY,
        })
          .then(function(response) {
            if (!response.ok) {
              throw new Error('Heatmap tile request failed with status ' + response.status);
            }
            var classesHeader = response.headers.get('X-Nominal-Classes');
            if (classesHeader) {
              var classes = classesHeader.split(',').reduce(function(acc, part) {
                var sep = part.indexOf(':');
                if (sep === -1) return acc;
                var id = Number(part.slice(0, sep));
                var count = Number(part.slice(sep + 1));
                if (!isNaN(id) && !isNaN(count)) acc.push({ id: id, count: count });
                return acc;
              }, []);
              tileClassData.set(tile, classes);
              postClassMessage('tileClasses', classes);
            }
            return response.blob();
          })
          .then(function(blob) {
            if (controller.signal.aborted) {
              finish(null);
              return;
            }
            const objectUrl = URL.createObjectURL(blob);
            objectUrls.set(tile, objectUrl);
            tile.src = objectUrl;
          })
          .catch(function(error) {
            revokeObjectUrl();
            controllers.delete(tile);
            if (error && error.name === 'AbortError') {
              finish(null);
              return;
            }
            finish(error);
          });

        return tile;
      };

      return layer;
    }

    if (HEATMAP_TILE_URL) {
      const heatmapLayer = supportsAbortableTileFetch()
        ? createAbortableHeatmapLayer(HEATMAP_TILE_URL)
        : L.tileLayer(HEATMAP_TILE_URL, {
            opacity: HEATMAP_OPACITY,
            tileSize: 256,
            maxZoom: TILE_MAX_ZOOM,
          });
      heatmapLayer.addTo(map);
    }

    const markerStyle = {
      radius: 4,
      fillColor: palette.markerFill,
      color: palette.markerStroke,
      weight: 1,
      opacity: 0.9,
      fillOpacity: 0.9,
    };
    const nodataStyle = {
      radius: 4,
      fillColor: '#ffffff',
      color: '#999999',
      weight: 1,
      opacity: 0.7,
      fillOpacity: 0.5,
    };
    const hiddenStyle = { radius: 0, opacity: 0, fillOpacity: 0, weight: 0 };
    const activeHighlightCatalogs = new Set();
    const markers = new Map();
    let selectedPointMarker = null;

    let selectedCatalogKey = null;
    let selectedCatalogDirectMarker = null;
    let refreshVisibleMarkerPresentationImpl = null;

    function refreshVisibleMarkerPresentation() {
      if (refreshVisibleMarkerPresentationImpl) {
        refreshVisibleMarkerPresentationImpl();
      }
    }

    function buildObservationValueHtml(varValue, varColor, varLabel) {
      if (varValue == null) return isVariableColorMode ? '<div style="margin-top:4px"><span style="opacity:0.6;font-size:11px">No data</span></div>' : '';
      var isNumericVar = DOT_MIN != null && DOT_MAX != null && DOT_MAX > DOT_MIN;
      if (varColor) {
        var dot = '<span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:' + varColor + ';margin-right:5px;flex-shrink:0"></span>';
        var labelText = varLabel || '';
        return '<div style="display:flex;align-items:center;font-size:12px;margin-top:4px">' + dot + (labelText ? '<span>' + labelText + '</span>' : '') + '</div>';
      }
      if (IS_CIRCULAR) {
        var color = aspectColor(varValue);
        var dot = '<span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:' + color + ';margin-right:5px;flex-shrink:0"></span>';
        var fmt = varValue.toLocaleString(undefined, {maximumFractionDigits: 1});
        return '<div style="display:flex;align-items:center;font-size:12px;margin-top:4px">' + dot + '<span>' + fmt + '°</span></div>';
      }
      if (isNumericVar) {
        var t = Math.max(0, Math.min(1, (varValue - DOT_MIN) / (DOT_MAX - DOT_MIN)));
        var color = gradientColor(t);
        var dot = '<span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:' + color + ';margin-right:5px;flex-shrink:0"></span>';
        var units = VAR_UNITS ? ' ' + VAR_UNITS : '';
        var fmt = Math.abs(varValue) >= 1000 ? varValue.toLocaleString(undefined, {maximumFractionDigits: 0}) : varValue.toLocaleString(undefined, {maximumFractionDigits: 2});
        return '<div style="display:flex;align-items:center;font-size:12px;margin-top:4px">' + dot + '<span>' + fmt + units + '</span></div>';
      }
      return '';
    }

    function buildObservationPopupContent(catalogHref, catalogLabel, varValue, varColor, varLabel) {
      var inatHtml = (LINK_OBSERVATIONS && catalogLabel && catalogHref)
        ? '<a href="https://www.inaturalist.org/observations/' + catalogHref + '" target="_blank" rel="noopener noreferrer" data-open-external-url="true">Observation #' + catalogLabel + '</a>'
        : '';
      return inatHtml + buildObservationValueHtml(varValue, varColor, varLabel);
    }

    function sendPinMessage(catalogNumber, latitude, longitude) {
      const msg = {
        type: PIN_OBSERVATION_MESSAGE_TYPE,
        catalogNumber: catalogNumber,
        latitude: latitude,
        longitude: longitude,
      };
      if (window.ReactNativeWebView) {
        window.ReactNativeWebView.postMessage(JSON.stringify(msg));
      } else {
        // codeql[js/cross-window-information-leak] -- internal WebView iframe, loaded as blob URL so location.origin is "null"
        window.parent.postMessage(msg, '*');
      }
      map.closePopup();
    }

    function sendOpenExternalUrlMessage(url) {
      const msg = {
        type: OPEN_EXTERNAL_URL_MESSAGE_TYPE,
        url: url,
      };
      if (window.ReactNativeWebView) {
        window.ReactNativeWebView.postMessage(JSON.stringify(msg));
      } else {
        // codeql[js/cross-window-information-leak] -- internal WebView iframe, loaded as blob URL so location.origin is "null"
        window.parent.postMessage(msg, '*');
      }
    }

    function handlePinButtonClick(event) {
      const clickTarget = event && event.target;
      const pinButton = clickTarget && typeof clickTarget.closest === 'function'
        ? clickTarget.closest('[data-pin-observation="true"]')
        : null;
      if (!pinButton || !pinButton.dataset) {
        return;
      }

      const catalogNumber = pinButton.dataset.catalogNumber
        ? decodeURIComponent(pinButton.dataset.catalogNumber)
        : '';
      const latitude = Number(pinButton.dataset.latitude);
      const longitude = Number(pinButton.dataset.longitude);
      if (!catalogNumber || !isFinite(latitude) || !isFinite(longitude)) {
        return;
      }

      event.preventDefault?.();
      sendPinMessage(catalogNumber, latitude, longitude);
    }

    function buildPinButtonHtml(catalogNumber, latitude, longitude, marginTop) {
      if (!ALLOW_PIN_OBSERVATIONS) {
        return '';
      }
      const resolvedMarginTop = typeof marginTop === 'string' ? marginTop : '6px';
      return '<button type="button" data-pin-observation="true" data-catalog-number="' + encodeURIComponent(catalogNumber) + '" data-latitude="' + latitude + '" data-longitude="' + longitude + '" style="display:block;margin-top:' + resolvedMarginTop + ';padding:4px 8px;font-size:12px;cursor:pointer;background:none;border:1px solid currentColor;border-radius:4px;width:100%;text-align:left;">Highlight in Environmental Features</button>';
    }

    function buildMapClickPopup(latitude, longitude) {
      const syntheticCatalog = 'point:' + latitude.toFixed(6) + ',' + longitude.toFixed(6);
      return buildPinButtonHtml(syntheticCatalog, latitude, longitude);
    }

    function handleExternalLinkClick(event) {
      const clickTarget = event && event.target;
      const externalLink = clickTarget && typeof clickTarget.closest === 'function'
        ? clickTarget.closest('[data-open-external-url="true"]')
        : null;
      if (!externalLink) {
        return false;
      }

      const url = externalLink.getAttribute('href');
      if (!url) {
        return false;
      }

      event.preventDefault?.();
      sendOpenExternalUrlMessage(url);
      return true;
    }

    var markerBaseColors = new Map();

    var NODATA_SENTINEL = '__nodata__';

    function styleForCatalog(catalog) {
      var baseColor = markerBaseColors.get(catalog);
      if (baseColor === NODATA_SENTINEL) return nodataStyle;
      return baseColor ? Object.assign({}, markerStyle, { fillColor: baseColor, color: baseColor }) : markerStyle;
    }

    function effectiveStyleForCatalog(catalog) {
      if (activeHighlightCatalogs.size > 0 && !activeHighlightCatalogs.has(catalog)) return hiddenStyle;
      return styleForCatalog(catalog);
    }

    var isVariableColorMode = IS_CIRCULAR || (DOT_MIN != null && DOT_MAX != null && DOT_MAX > DOT_MIN);

    function baseStyleForPoint(pt, catalog) {
      if (pt.varColor) {
        markerBaseColors.set(catalog, pt.varColor);
        return Object.assign({}, markerStyle, { fillColor: pt.varColor, color: pt.varColor });
      }
      if (IS_CIRCULAR && pt.varValue != null) {
        var color = aspectColor(pt.varValue);
        markerBaseColors.set(catalog, color);
        return Object.assign({}, markerStyle, { fillColor: color, color: color });
      }
      if (DOT_MIN != null && DOT_MAX != null && DOT_MAX > DOT_MIN && pt.varValue != null) {
        var t = Math.max(0, Math.min(1, (pt.varValue - DOT_MIN) / (DOT_MAX - DOT_MIN)));
        var color = gradientColor(t);
        markerBaseColors.set(catalog, color);
        return Object.assign({}, markerStyle, { fillColor: color, color: color });
      }
      if (isVariableColorMode && pt.varValue == null) {
        markerBaseColors.set(catalog, NODATA_SENTINEL);
        return nodataStyle;
      }
      return markerStyle;
    }

    function applyHighlights(list) {
      activeHighlightCatalogs.clear();
      if (Array.isArray(list)) {
        list.forEach((item) => {
          activeHighlightCatalogs.add(String(item));
        });
      }
      markers.forEach((marker, catalog) => {
        marker.setStyle(effectiveStyleForCatalog(catalog));
      });
      refreshVisibleMarkerPresentation();
    }

    function handleHighlightMessage(payload) {
      let data = payload;
      if (typeof payload === 'string') {
        try {
          data = JSON.parse(payload);
        } catch {
          return;
        }
      }
      if (data && data.type === HIGHLIGHT_MESSAGE_TYPE) {
        applyHighlights(data.catalogs || []);
        return;
      }

      if (data && data.type === SELECTED_POINT_MESSAGE_TYPE) {
        applySelectedPoint(data.point || null);
        return;
      }

      if (data && data.type === 'colormapUpdate') {
        if (Array.isArray(data.stops) && DOT_MIN != null && DOT_MAX != null && DOT_MAX > DOT_MIN) {
          GRADIENT_STOPS = data.stops;
          markers.forEach(function(entry, catalog) {
            if (entry.varValue != null) {
              var t = Math.max(0, Math.min(1, (entry.varValue - DOT_MIN) / (DOT_MAX - DOT_MIN)));
              markerBaseColors.set(catalog, gradientColor(t));
              entry.setStyle(effectiveStyleForCatalog(catalog));
            }
          });
        }
        if (Array.isArray(data.circularStops) && IS_CIRCULAR) {
          ASPECT_STOPS = data.circularStops;
          markers.forEach(function(entry, catalog) {
            if (entry.varValue != null) {
              var color = aspectColor(entry.varValue);
              markerBaseColors.set(catalog, color);
              entry.setStyle(effectiveStyleForCatalog(catalog));
            }
          });
        }
      }
    }

    function applySelectedPoint(point) {
      if (selectedCatalogDirectMarker) {
        map.removeLayer(selectedCatalogDirectMarker);
        selectedCatalogDirectMarker = null;
      }

      restorePreviouslySelectedMarker();

      if (selectedCatalogKey != null) {
        selectedCatalogKey = null;
      }

      if (selectedPointMarker) {
        map.removeLayer(selectedPointMarker);
        selectedPointMarker = null;
      }

      if (!point || typeof point.latitude !== 'number' || typeof point.longitude !== 'number') {
        refreshVisibleMarkerPresentation();
        return;
      }

      const latitude = clampLatitude(point.latitude);
      const longitude = Number(point.longitude);
      if (!isFinite(latitude) || !isFinite(longitude)) {
        refreshVisibleMarkerPresentation();
        return;
      }

      const alignedLongitude = alignLongitudeToView(longitude, map.getCenter().lng);
      const matchingEntry = markerEntries
        ? markerEntries.find(function(e) {
            return Math.abs(e.latitude - latitude) < 1e-6 &&
                   Math.abs(e.longitude - longitude) < 1e-6;
          })
        : null;

      if (matchingEntry) {
        selectedCatalogKey = matchingEntry.key;

        if (visibleMarkerLayer && matchingEntry.directMarker) {
          visibleMarkerLayer.removeLayer(matchingEntry.directMarker);
          matchingEntry.directMarker = null;
        }

        hideClusterMarker(matchingEntry);

        var baseColor = markerBaseColors.get(matchingEntry.key);
        var pinnedObsStyle = Object.assign(
          {},
          baseColor ? { fillColor: baseColor, color: baseColor } : { fillColor: markerStyle.fillColor, color: markerStyle.color },
          { radius: markerStyle.radius, fillOpacity: markerStyle.fillOpacity, opacity: 1,
            weight: 2, color: palette.selectedPointStroke, dashArray: '2 2' }
        );
        selectedCatalogDirectMarker = L.circleMarker(
          [latitude, alignedLongitude],
          pinnedObsStyle,
        );
        var selectedPopupContent = buildObservationPopupContent(
          matchingEntry.catalogHref, matchingEntry.catalogLabel,
          matchingEntry.varValue, matchingEntry.varColor, matchingEntry.varLabel
        );
        selectedCatalogDirectMarker.bindPopup(selectedPopupContent || matchingEntry.popupHtml || '');
        bindObservationMarkerEvents(
          selectedCatalogDirectMarker,
          matchingEntry.catalogValue, matchingEntry.catalogHref, matchingEntry.catalogLabel,
          latitude, matchingEntry.longitude,
          matchingEntry.varValue, matchingEntry.varColor, matchingEntry.varLabel
        );
        map.addLayer(selectedCatalogDirectMarker);
        if (selectedPopupContent) {
          selectedCatalogDirectMarker.openPopup();
        } else if (POINT_QUERY_URL && !DISABLE_OBSERVATION_QUERY) {
          var selInatHtml = (LINK_OBSERVATIONS && matchingEntry.catalogLabel && matchingEntry.catalogHref)
            ? '<a href="https://www.inaturalist.org/observations/' + matchingEntry.catalogHref + '" target="_blank" rel="noopener noreferrer" data-open-external-url="true">Observation #' + matchingEntry.catalogLabel + '</a>'
            : '';
          fetchAndShowPointValue(selectedCatalogDirectMarker, selInatHtml, latitude, matchingEntry.longitude);
        }
        refreshVisibleMarkerPresentation();
        return;
      }

      selectedPointMarker = L.circleMarker(
        [latitude, alignedLongitude],
        { radius: markerStyle.radius, fillOpacity: 0, fillColor: 'transparent',
          color: palette.selectedPointStroke, weight: 2, opacity: 1, dashArray: '2 2' }
      ).addTo(map);

      refreshVisibleMarkerPresentation();
    }

    document.addEventListener('click', (event) => {
      if (handleExternalLinkClick(event)) {
        return;
      }
      handlePinButtonClick(event);
    });
    document.addEventListener('message', (event) => handleHighlightMessage(event.data));
    window.addEventListener('message', (event) => handleHighlightMessage(event.data));

    let markerEntries = [];
    let clusterGroup = null;
    let visibleMarkerLayer = null;
    let showingVisibleIndividualMarkers = false;

    function hideClusterMarker(entry) {
      if (!clusterGroup || !entry || !entry.clusterMarker || entry.clusterMarkerHidden) {
        return;
      }
      clusterGroup.removeLayer(entry.clusterMarker);
      entry.clusterMarkerHidden = true;
    }

    function restoreClusterMarker(entry) {
      if (!clusterGroup || !entry || !entry.clusterMarker || !entry.clusterMarkerHidden) {
        return;
      }
      clusterGroup.addLayer(entry.clusterMarker);
      entry.clusterMarkerHidden = false;
    }

    function restorePreviouslySelectedMarker() {
      if (selectedCatalogKey == null) {
        return;
      }

      const previousEntry = markerEntries.find(function(e) { return e.key === selectedCatalogKey; });
      if (previousEntry) {
        restoreClusterMarker(previousEntry);
      }
    }

    if (SHOW_MARKERS && Array.isArray(points) && points.length) {
      const observedBounds = [];
      const directMarkerAnchors = [];
      const useVisibilityManagedClustering =
        points.length > MAX_VISIBLE_UNCLUSTERED_OBSERVATIONS;
      clusterGroup = useVisibilityManagedClustering
        ? L.markerClusterGroup({
          spiderfyOnMaxZoom: false,
          chunkedLoading: true,
          chunkInterval: 120,
          chunkDelay: 20,
        })
        : null;
      visibleMarkerLayer = useVisibilityManagedClustering ? L.layerGroup() : null;
      showingVisibleIndividualMarkers = !useVisibilityManagedClustering;

      function buildObservationPopup(catalogNumber, catalogHref, catalogLabel, latitude, longitude) {
        if (!LINK_OBSERVATIONS || !catalogHref || !catalogLabel) {
          return '';
        }
        return '<a href="https://www.inaturalist.org/observations/' + catalogHref + '" target="_blank" rel="noopener noreferrer" data-open-external-url="true">Observation #' + catalogLabel + '</a>';
      }

      function fetchAndShowPointValue(marker, inatHtml, latitude, longitude) {
        var loadingHtml = (inatHtml ? inatHtml + '<br>' : '') + '<span style="opacity:0.6;font-size:11px">Loading…</span>';
        var popup = marker.getPopup();
        if (!popup) {
          marker.bindPopup(loadingHtml);
          popup = marker.getPopup();
        } else {
          popup.setContent(loadingHtml);
        }
        if (!marker.isPopupOpen()) {
          marker.openPopup();
        }
        fetch(POINT_QUERY_URL + '&lat=' + latitude + '&lon=' + longitude)
          .then(function(r) { return r.ok ? r.json() : Promise.reject(r.status); })
          .then(function(data) {
            if (!marker.isPopupOpen()) return;
            var valueHtml = '';
            if (data.value != null) {
              var numVal = Number(data.value);
              if (isFinite(numVal)) {
                var pvMsg = { type: 'pointValue', value: numVal };
                if (window.ReactNativeWebView) {
                  window.ReactNativeWebView.postMessage(JSON.stringify(pvMsg));
                } else {
                  // codeql[js/cross-window-information-leak] -- internal WebView iframe, loaded as blob URL so location.origin is "null"
          window.parent.postMessage(pvMsg, '*');
                }
                var isNumericVar = DOT_MIN != null && DOT_MAX != null && DOT_MAX > DOT_MIN;
                var units = data.units ? ' ' + data.units : (VAR_UNITS ? ' ' + VAR_UNITS : '');
                if (IS_CIRCULAR) {
                  var color = aspectColor(numVal);
                  var dot = '<span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:' + color + ';margin-right:5px;flex-shrink:0"></span>';
                  var fmt = numVal.toLocaleString(undefined, {maximumFractionDigits: 1});
                  valueHtml = '<div style="display:flex;align-items:center;font-size:12px;margin-top:4px">' + dot + '<span>' + fmt + '°</span></div>';
                } else if (isNumericVar) {
                  var t = Math.max(0, Math.min(1, (numVal - DOT_MIN) / (DOT_MAX - DOT_MIN)));
                  var color = gradientColor(t);
                  var dot = '<span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:' + color + ';margin-right:5px;flex-shrink:0"></span>';
                  var fmt = Math.abs(numVal) >= 1000 ? numVal.toLocaleString(undefined, {maximumFractionDigits: 0}) : numVal.toLocaleString(undefined, {maximumFractionDigits: 2});
                  valueHtml = '<div style="display:flex;align-items:center;font-size:12px;margin-top:4px">' + dot + '<span>' + fmt + units + '</span></div>';
                }
              }
            } else {
              valueHtml = '<span style="opacity:0.6;font-size:11px">No data</span>';
            }
            marker.getPopup().setContent((inatHtml || '') + valueHtml);
          })
          .catch(function() {
            if (marker.isPopupOpen()) marker.getPopup().setContent((inatHtml || '') + '<span style="opacity:0.6;font-size:11px">Offline</span>');
          });
      }

      function bindObservationMarkerEvents(marker, catalogValue, catalogHref, catalogLabel, latitude, longitude, varValue, varColor, varLabel) {
        var inatHtml = (LINK_OBSERVATIONS && catalogLabel && catalogHref)
          ? '<a href="https://www.inaturalist.org/observations/' + catalogHref + '" target="_blank" rel="noopener noreferrer" data-open-external-url="true">Observation #' + catalogLabel + '</a>'
          : '';
        marker.on('click', function(e) {
          L.DomEvent.stopPropagation(e);
          if (ALLOW_PIN_OBSERVATIONS && catalogValue) {
            sendPinMessage(catalogValue, latitude, longitude);
          }
          if (varValue != null) {
            var pvMsg = { type: 'pointValue', value: varValue };
            if (window.ReactNativeWebView) {
              window.ReactNativeWebView.postMessage(JSON.stringify(pvMsg));
            } else {
              // codeql[js/cross-window-information-leak] -- internal WebView iframe, loaded as blob URL so location.origin is "null"
          window.parent.postMessage(pvMsg, '*');
            }
            var content = buildObservationPopupContent(catalogHref, catalogLabel, varValue, varColor, varLabel);
            var popup = marker.getPopup();
            if (!popup) {
              marker.bindPopup(content);
              popup = marker.getPopup();
            } else {
              popup.setContent(content);
            }
            if (!marker.isPopupOpen()) marker.openPopup();
          } else if (isVariableColorMode) {
            var content = inatHtml + '<div style="margin-top:4px"><span style="opacity:0.6;font-size:11px">No data</span></div>';
            var popup = marker.getPopup();
            if (!popup) {
              marker.bindPopup(content);
              popup = marker.getPopup();
            } else {
              popup.setContent(content);
            }
            if (!marker.isPopupOpen()) marker.openPopup();
          } else if (POINT_QUERY_URL && !DISABLE_OBSERVATION_QUERY) {
            fetchAndShowPointValue(marker, inatHtml, latitude, longitude);
          }
        });
      }

      function applyEntryStyle(entry, style) {
        entry.clusterMarker?.setStyle(style);
        entry.directMarker?.setStyle(style);
      }

      function visibleEntriesForCurrentView(centerLongitude) {
        const currentBounds = map.getBounds();
        const visibleEntries = [];
        markerEntries.forEach((entry) => {
          const alignedLongitude = alignLongitudeToView(entry.longitude, centerLongitude);
          if (currentBounds.contains(L.latLng(entry.latitude, alignedLongitude))) {
            visibleEntries.push({ entry, alignedLongitude });
          }
        });
        return visibleEntries;
      }

      function ensureVisibleDirectMarker(entry, alignedLongitude) {
        if (!visibleMarkerLayer) {
          return;
        }
        if (entry.key === selectedCatalogKey) {
          return;
        }
        if (!entry.directMarker) {
          entry.directMarker = L.circleMarker(
            [entry.latitude, alignedLongitude],
            effectiveStyleForCatalog(entry.key),
          );
          if (entry.popupHtml) {
            entry.directMarker.bindPopup(entry.popupHtml);
          }
          bindObservationMarkerEvents(
            entry.directMarker,
            entry.catalogValue, entry.catalogHref, entry.catalogLabel,
            entry.latitude, entry.longitude,
            entry.varValue, entry.varColor, entry.varLabel
          );
          visibleMarkerLayer.addLayer(entry.directMarker);
        } else {
          entry.directMarker.setLatLng([entry.latitude, alignedLongitude]);
          entry.directMarker.setStyle(effectiveStyleForCatalog(entry.key));
        }
        entry.alignedLongitude = alignedLongitude;
      }

      function removeVisibleDirectMarker(entry) {
        if (!visibleMarkerLayer || !entry.directMarker) {
          return;
        }
        visibleMarkerLayer.removeLayer(entry.directMarker);
        entry.directMarker = null;
      }

      function syncDirectMarkersToCurrentWorld() {
        const centerLongitude = map.getCenter().lng;
        directMarkerAnchors.forEach((entry) => {
          const alignedLongitude = alignLongitudeToView(entry.longitude, centerLongitude);
          entry.marker.setLatLng([entry.latitude, alignedLongitude]);
          entry.alignedLongitude = alignedLongitude;
        });

        if (selectedCatalogDirectMarker && selectedCatalogKey != null) {
          const selEntry = markerEntries.find(function(e) { return e.key === selectedCatalogKey; });
          if (selEntry) {
            const alignedLon = alignLongitudeToView(selEntry.longitude, centerLongitude);
            selectedCatalogDirectMarker.setLatLng([selEntry.latitude, alignedLon]);
          }
        }
      }

      function syncClusterMarkersToCurrentWorld() {
        if (!clusterGroup) {
          return false;
        }

        const centerLongitude = map.getCenter().lng;
        let changed = false;

        markerEntries.forEach((entry) => {
          const alignedLongitude = alignLongitudeToView(entry.longitude, centerLongitude);
          if (entry.alignedLongitude === alignedLongitude) {
            return;
          }

          entry.clusterMarker.setLatLng([entry.latitude, alignedLongitude]);
          entry.alignedLongitude = alignedLongitude;
          changed = true;
        });

        return changed;
      }

      function rebuildClusterGroupIfNeeded() {
        if (!clusterGroup || showingVisibleIndividualMarkers) {
          return;
        }

        if (!syncClusterMarkersToCurrentWorld()) {
          return;
        }

        map.removeLayer(clusterGroup);
        clusterGroup.addTo(map);
      }

      refreshVisibleMarkerPresentationImpl = function() {
        if (!useVisibilityManagedClustering || !clusterGroup || !visibleMarkerLayer) {
          syncDirectMarkersToCurrentWorld();
          return;
        }

        const centerLongitude = map.getCenter().lng;
        const visibleEntries = visibleEntriesForCurrentView(centerLongitude);
        const activeVisibleEntries = visibleEntries.filter(({ entry }) => !entry.clusterMarkerHidden);
        const shouldShowVisibleIndividuals =
          activeVisibleEntries.length > 0 &&
          activeVisibleEntries.length <= MAX_VISIBLE_UNCLUSTERED_OBSERVATIONS;

        if (shouldShowVisibleIndividuals) {
          if (!showingVisibleIndividualMarkers) {
            map.removeLayer(clusterGroup);
            visibleMarkerLayer.addTo(map);
            showingVisibleIndividualMarkers = true;
          }

          const visibleKeys = new Set();
          activeVisibleEntries.forEach(({ entry, alignedLongitude }) => {
            visibleKeys.add(entry.key);
            ensureVisibleDirectMarker(entry, alignedLongitude);
          });

          markerEntries.forEach((entry) => {
            if (!visibleKeys.has(entry.key)) {
              removeVisibleDirectMarker(entry);
            }
          });

          if (selectedCatalogDirectMarker && selectedCatalogKey != null) {
            const selEntry = markerEntries.find(function(e) { return e.key === selectedCatalogKey; });
            if (selEntry) {
              const alignedLon = alignLongitudeToView(selEntry.longitude, centerLongitude);
              selectedCatalogDirectMarker.setLatLng([selEntry.latitude, alignedLon]);
            }
          }
          return;
        }

        markerEntries.forEach(removeVisibleDirectMarker);
        if (showingVisibleIndividualMarkers) {
          map.removeLayer(visibleMarkerLayer);
          clusterGroup.addTo(map);
          showingVisibleIndividualMarkers = false;
        }

        rebuildClusterGroupIfNeeded();

        if (selectedCatalogDirectMarker && selectedCatalogKey != null) {
          const selEntry = markerEntries.find(function(e) { return e.key === selectedCatalogKey; });
          if (selEntry) {
            const alignedLon = alignLongitudeToView(selEntry.longitude, centerLongitude);
            selectedCatalogDirectMarker.setLatLng([selEntry.latitude, alignedLon]);
          }
        }
      };

      points.forEach((pt, idx) => {
        if (typeof pt.latitude !== 'number' || typeof pt.longitude !== 'number') {
          return;
        }

        const latitude = clampLatitude(pt.latitude);
        const canonicalLongitude = Number(pt.longitude);
        if (!isFinite(latitude) || !isFinite(canonicalLongitude)) {
          return;
        }

        const initialLongitude = alignLongitudeToView(canonicalLongitude, 0);
        const catalog = pt.catalogNumber ? String(pt.catalogNumber) : '';
        const markerKey = catalog.length ? catalog : 'fallback-' + String(idx);
        const popupHtml = buildObservationPopup(
          pt.popupCatalogValue,
          pt.popupCatalogHref,
          pt.popupCatalogLabel,
          latitude,
          canonicalLongitude,
        );

        if (useVisibilityManagedClustering && clusterGroup) {
          const clusterMarker = L.circleMarker(
            [latitude, initialLongitude],
            baseStyleForPoint(pt, markerKey),
          );
          if (popupHtml) {
            clusterMarker.bindPopup(popupHtml);
          }
          bindObservationMarkerEvents(clusterMarker, pt.popupCatalogValue, pt.popupCatalogHref, pt.popupCatalogLabel, latitude, canonicalLongitude, pt.varValue ?? null, pt.varColor ?? null, pt.varLabel ?? null);

          const markerEntry = {
            key: markerKey,
            latitude,
            longitude: canonicalLongitude,
            alignedLongitude: initialLongitude,
            popupHtml,
            clusterMarker,
            clusterMarkerHidden: false,
            directMarker: null,
            catalogValue: pt.popupCatalogValue ?? '',
            catalogHref: pt.popupCatalogHref ?? '',
            catalogLabel: pt.popupCatalogLabel ?? '',
            varValue: pt.varValue ?? null,
            varColor: pt.varColor ?? null,
            varLabel: pt.varLabel ?? null,
          };

          clusterGroup.addLayer(clusterMarker);
          markerEntries.push(markerEntry);
          markers.set(markerKey, {
            varValue: pt.varValue ?? null,
            setStyle(style) {
              if (style === hiddenStyle) {
                hideClusterMarker(markerEntry);
              } else {
                restoreClusterMarker(markerEntry);
              }
              applyEntryStyle(markerEntry, style);
            },
          });
        } else {
          const marker = L.circleMarker(
            [latitude, initialLongitude],
            baseStyleForPoint(pt, markerKey),
          );
          if (popupHtml) {
            marker.bindPopup(popupHtml);
          }
          bindObservationMarkerEvents(marker, pt.popupCatalogValue, pt.popupCatalogHref, pt.popupCatalogLabel, latitude, canonicalLongitude, pt.varValue ?? null, pt.varColor ?? null, pt.varLabel ?? null);
          map.addLayer(marker);
          directMarkerAnchors.push({
            marker,
            latitude,
            longitude: canonicalLongitude,
            alignedLongitude: initialLongitude,
          });
          markers.set(markerKey, {
            varValue: pt.varValue ?? null,
            setStyle(style) { marker.setStyle(style); },
          });
        }

        observedBounds.push([latitude, initialLongitude]);
      });

      if (useVisibilityManagedClustering && clusterGroup) {
        map.addLayer(clusterGroup);
      }

      if (observedBounds.length) {
        map.fitBounds(observedBounds, { padding: [20, 20] });
      } else {
        map.setView([0, 0], BASE_MIN_ZOOM);
      }

      map.on('moveend', refreshVisibleMarkerPresentation);
      map.on('zoomend', refreshVisibleMarkerPresentation);
      refreshVisibleMarkerPresentation();

      map.on('moveend', postMapBounds);
      map.on('zoomend', postMapBounds);
      postMapBounds();
    } else {
      map.setView([INITIAL_LAT, INITIAL_LON], INITIAL_ZOOM);
      postMapBounds();
    }

    function postMapBounds() {
      var b = map.getBounds();
      var msg = { type: 'mapBounds', north: b.getNorth(), south: b.getSouth(), east: b.getEast(), west: b.getWest() };
      if (window.ReactNativeWebView) {
        window.ReactNativeWebView.postMessage(JSON.stringify(msg));
      } else {
        // codeql[js/cross-window-information-leak] -- internal WebView iframe, loaded as blob URL so location.origin is "null"
        window.parent.postMessage(msg, '*');
      }
    }

    map.on('click', function(event) {
      const latitude = Number(event.latlng?.lat);
      const longitude = Number(event.latlng?.lng);
      if (!isFinite(latitude) || !isFinite(longitude)) {
        return;
      }

      if (POINT_QUERY_URL) {
        if (ALLOW_PIN_OBSERVATIONS) {
          sendPinMessage('point:' + latitude.toFixed(6) + ',' + longitude.toFixed(6), latitude, longitude);
        }
        var popup = L.popup().setLatLng(event.latlng).setContent('<span style="opacity:0.6;font-size:11px">Loading…</span>').openOn(map);
        fetch(POINT_QUERY_URL + '&lat=' + latitude + '&lon=' + longitude)
          .then(function(r) { return r.ok ? r.json() : Promise.reject(r.status); })
          .then(function(data) {
            if (!popup.isOpen()) return;
            if (data.value == null) {
              popup.setContent('<span style="opacity:0.6;font-size:11px">No data</span>');
              return;
            }
            var numVal = Number(data.value);
            if (isFinite(numVal)) {
              var pvMsg = { type: 'pointValue', value: numVal };
              if (window.ReactNativeWebView) {
                window.ReactNativeWebView.postMessage(JSON.stringify(pvMsg));
              } else {
                // codeql[js/cross-window-information-leak] -- internal WebView iframe, loaded as blob URL so location.origin is "null"
          window.parent.postMessage(pvMsg, '*');
              }
            }
            var colorMin = DOT_MIN != null ? DOT_MIN : RENDER_MIN;
            var colorMax = DOT_MAX != null ? DOT_MAX : RENDER_MAX;
            var isNumeric = colorMin != null && colorMax != null && colorMax > colorMin;
            if (data.class_name || data.class_color) {
              var dot = data.class_color ? '<span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:' + data.class_color + ';margin-right:5px;flex-shrink:0"></span>' : '';
              var label = data.class_name || String(numVal);
              popup.setContent('<div style="display:flex;align-items:center;font-size:12px;max-width:180px">' + dot + '<span>' + label + '</span></div>');
            } else if (IS_CIRCULAR) {
              var color = aspectColor(numVal);
              var dot = '<span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:' + color + ';margin-right:5px;flex-shrink:0"></span>';
              var fmt = numVal.toLocaleString(undefined, {maximumFractionDigits: 1});
              popup.setContent('<div style="display:flex;align-items:center;font-size:12px">' + dot + '<span>' + fmt + '\u00b0</span></div>');
            } else if (isNumeric) {
              var t = Math.max(0, Math.min(1, (numVal - colorMin) / (colorMax - colorMin)));
              var color = gradientColor(t);
              var dot = '<span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:' + color + ';margin-right:5px;flex-shrink:0"></span>';
              var units = data.units ? ' ' + data.units : '';
              var fmt = Math.abs(numVal) >= 1000
                ? numVal.toLocaleString(undefined, {maximumFractionDigits: 0})
                : numVal.toLocaleString(undefined, {maximumFractionDigits: 2});
              popup.setContent('<div style="display:flex;align-items:center;font-size:12px">' + dot + '<span>' + fmt + units + '</span></div>');
            } else {
              var dot = data.class_color
                ? '<span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:' + data.class_color + ';margin-right:5px;flex-shrink:0"></span>'
                : '';
              var units = data.units ? ' ' + data.units : '';
              var label = data.class_name || numVal.toLocaleString(undefined, {maximumFractionDigits: 2}) + units;
              popup.setContent('<div style="display:flex;align-items:center;font-size:12px;max-width:180px">' + dot + '<span>' + label + '</span></div>');
            }
          })
          .catch(function() {
            if (popup.isOpen()) popup.setContent('<span style="opacity:0.6;font-size:11px">Offline</span>');
          });
        return;
      }

      if (!ALLOW_PIN_OBSERVATIONS) {
        map.closePopup();
        return;
      }
      sendPinMessage('point:' + latitude.toFixed(6) + ',' + longitude.toFixed(6), latitude, longitude);
      map.closePopup();
    });

    function latLonToTile(lat, lon, z) {
      var n = Math.pow(2, z);
      var x = Math.floor((lon + 180) / 360 * n);
      var latRad = lat * Math.PI / 180;
      var y = Math.floor((1 - Math.log(Math.tan(latRad) + 1 / Math.cos(latRad)) / Math.PI) / 2 * n);
      return { x: Math.max(0, Math.min(n - 1, x)), y: Math.max(0, Math.min(n - 1, y)) };
    }

    function sendTiles() {
      var z = map.getZoom();
      var b = map.getBounds();
      var nw = latLonToTile(b.getNorth(), b.getWest(), z);
      var se = latLonToTile(b.getSouth(), b.getEast(), z);
      var msg = {
        type: 'tilesChanged',
        z: z,
        x0: nw.x, y0: nw.y,
        x1: se.x, y1: se.y,
      };
      if (window.ReactNativeWebView) {
        window.ReactNativeWebView.postMessage(JSON.stringify(msg));
      } else {
        // codeql[js/cross-window-information-leak] -- internal WebView iframe, loaded as blob URL so location.origin is "null"
        window.parent.postMessage(msg, '*');
      }
    }

    map.on('moveend', sendTiles);
    map.on('zoomend', sendTiles);
    sendTiles();

    applyHighlights([]);
    applySelectedPoint(null);
  </script>
</body>
