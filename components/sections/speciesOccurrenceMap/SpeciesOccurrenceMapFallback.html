<!DOCTYPE html>
<html>

<head>
  <meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no" />
  <meta name="referrer" content="__REFERRER_POLICY__" />
  <base href="__DOCUMENT_BASE_URL__" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css" />
  <style>
    html,
    body,
    #map {
      height: 100%;
      width: 100%;
      margin: 0;
      padding: 0;
    }
  </style>
</head>

<body>
  <div id="map"></div>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
  <script>
    const points = __POINTS_JSON__;
    const palette = __PALETTE_JSON__;
    const HIGHLIGHT_MESSAGE_TYPE = __HIGHLIGHT_MESSAGE_TYPE_JSON__;
    const PIN_OBSERVATION_MESSAGE_TYPE = __PIN_OBSERVATION_MESSAGE_TYPE_JSON__;
    const SELECTED_POINT_MESSAGE_TYPE = __SELECTED_POINT_MESSAGE_TYPE_JSON__;
    const OPEN_EXTERNAL_URL_MESSAGE_TYPE = __OPEN_EXTERNAL_URL_MESSAGE_TYPE_JSON__;

    const MERCATOR_MAX_LAT = 85.05112878;
    const TILE_SIZE = 256;
    const BASE_MIN_ZOOM = 2;
    const MAX_LONGITUDE_BOUND = 1000000000;
    const TILE_REFERRER_POLICY = __REFERRER_POLICY_JSON__;
    const TILE_URL = __TILE_URL_JSON__;
    const TILE_ATTRIBUTION = __TILE_ATTRIBUTION_JSON__;
    const TILE_MAX_ZOOM = __TILE_MAX_ZOOM__;
    const MAX_VISIBLE_UNCLUSTERED_OBSERVATIONS = __MAX_VISIBLE_UNCLUSTERED_OBSERVATIONS__;
    const HEATMAP_TILE_URL = __HEATMAP_TILE_URL_JSON__;
    const HEATMAP_OPACITY = __HEATMAP_OPACITY__;
    const CUSTOM_MIN_ZOOM = __MIN_ZOOM__;
    const SHOW_MARKERS = __SHOW_MARKERS__;
    const ALLOW_PIN_OBSERVATIONS = __ALLOW_PIN_OBSERVATIONS__;
    const LINK_OBSERVATIONS = __LINK_OBSERVATIONS__;
    const mapBounds = L.latLngBounds(
      [[-MERCATOR_MAX_LAT, -MAX_LONGITUDE_BOUND], [MERCATOR_MAX_LAT, MAX_LONGITUDE_BOUND]],
    );

    function clampLatitude(value) {
      return Math.max(-MERCATOR_MAX_LAT, Math.min(MERCATOR_MAX_LAT, Number(value)));
    }

    function alignLongitudeToView(value, anchorLongitude) {
      const numeric = Number(value);
      const anchor = Number(anchorLongitude);
      if (!isFinite(numeric) || !isFinite(anchor)) {
        return numeric;
      }
      const worldOffset = Math.round((anchor - numeric) / 360);
      return numeric + worldOffset * 360;
    }

    function minZoomForMaxLongitudeSpan(sizeX) {
      const width = Number(sizeX);
      if (!isFinite(width) || width <= 0) {
        return Math.max(BASE_MIN_ZOOM, CUSTOM_MIN_ZOOM);
      }
      return Math.max(BASE_MIN_ZOOM, CUSTOM_MIN_ZOOM, Math.log2(width / TILE_SIZE));
    }

    const map = L.map('map', {
      maxBounds: mapBounds,
      maxBoundsViscosity: 1,
      minZoom: BASE_MIN_ZOOM,
      worldCopyJump: true,
    });

    function applyMinZoomForSize() {
      map.setMinZoom(minZoomForMaxLongitudeSpan(map.getSize().x));
    }

    applyMinZoomForSize();
    map.on('resize', applyMinZoomForSize);

    const tileLayer = L.tileLayer(TILE_URL, {
      attribution: TILE_ATTRIBUTION,
      maxZoom: TILE_MAX_ZOOM,
      referrerPolicy: TILE_REFERRER_POLICY,
    });

    const originalCreateTile = tileLayer.createTile;
    tileLayer.createTile = function (coords, done) {
      const tile = originalCreateTile.call(this, coords, done);
      tile.referrerPolicy = TILE_REFERRER_POLICY;
      return tile;
    };
    tileLayer.addTo(map);

    function resolveTileUrl(template, coords) {
      return String(template)
        .replace('{z}', String(coords.z))
        .replace('{x}', String(coords.x))
        .replace('{y}', String(coords.y));
    }

    function supportsAbortableTileFetch() {
      return (
        typeof fetch === 'function'
        && typeof AbortController === 'function'
        && typeof URL !== 'undefined'
        && typeof URL.createObjectURL === 'function'
        && typeof URL.revokeObjectURL === 'function'
        && typeof document.createElement === 'function'
      );
    }

    function createAbortableHeatmapLayer(urlTemplate) {
      const layer = L.tileLayer(urlTemplate, {
        opacity: HEATMAP_OPACITY,
        tileSize: 256,
        maxZoom: TILE_MAX_ZOOM,
      });
      const controllers = new WeakMap();
      const objectUrls = new WeakMap();

      function releaseTile(tile) {
        const controller = controllers.get(tile);
        if (controller) {
          controller.abort();
          controllers.delete(tile);
        }
        const objectUrl = objectUrls.get(tile);
        if (objectUrl) {
          URL.revokeObjectURL(objectUrl);
          objectUrls.delete(tile);
        }
      }

      layer.on('tileunload', function(event) {
        if (event && event.tile) {
          releaseTile(event.tile);
        }
      });

      layer.createTile = function(coords, done) {
        const tile = document.createElement('img');
        const controller = new AbortController();
        let finished = false;

        function finish(error) {
          if (finished) {
            return;
          }
          finished = true;
          done(error || null, tile);
        }

        function revokeObjectUrl() {
          const objectUrl = objectUrls.get(tile);
          if (objectUrl) {
            URL.revokeObjectURL(objectUrl);
            objectUrls.delete(tile);
          }
        }

        controllers.set(tile, controller);
        tile.alt = '';
        tile.referrerPolicy = TILE_REFERRER_POLICY;
        tile.setAttribute('role', 'presentation');
        tile.onload = function() {
          revokeObjectUrl();
          controllers.delete(tile);
          finish(null);
        };
        tile.onerror = function(error) {
          revokeObjectUrl();
          controllers.delete(tile);
          if (controller.signal.aborted) {
            finish(null);
            return;
          }
          finish(error || new Error('Heatmap tile image load failed'));
        };

        fetch(resolveTileUrl(urlTemplate, coords), {
          signal: controller.signal,
          referrerPolicy: TILE_REFERRER_POLICY,
        })
          .then(function(response) {
            if (!response.ok) {
              throw new Error('Heatmap tile request failed with status ' + response.status);
            }
            return response.blob();
          })
          .then(function(blob) {
            if (controller.signal.aborted) {
              finish(null);
              return;
            }
            const objectUrl = URL.createObjectURL(blob);
            objectUrls.set(tile, objectUrl);
            tile.src = objectUrl;
          })
          .catch(function(error) {
            revokeObjectUrl();
            controllers.delete(tile);
            if (error && error.name === 'AbortError') {
              finish(null);
              return;
            }
            finish(error);
          });

        return tile;
      };

      return layer;
    }

    if (HEATMAP_TILE_URL) {
      const heatmapLayer = supportsAbortableTileFetch()
        ? createAbortableHeatmapLayer(HEATMAP_TILE_URL)
        : L.tileLayer(HEATMAP_TILE_URL, {
            opacity: HEATMAP_OPACITY,
            tileSize: 256,
            maxZoom: TILE_MAX_ZOOM,
          });
      heatmapLayer.addTo(map);
    }

    const markerStyle = {
      radius: 4,
      fillColor: palette.markerFill,
      color: palette.markerStroke,
      weight: 1,
      opacity: 0.9,
      fillOpacity: 0.9,
    };
    const highlightStyle = {
      radius: markerStyle.radius,
      fillColor: '#ffffff',
      color: 'rgba(0,0,0,0.65)',
      weight: 2,
      opacity: 1,
      fillOpacity: 1,
    };
    const activeHighlightCatalogs = new Set();
    const markers = new Map();
    let selectedPointMarker = null;
    let selectedCatalogDirectMarker = null;
    let selectedCatalogKey = null;
    let refreshVisibleMarkerPresentationImpl = null;

    function refreshVisibleMarkerPresentation() {
      if (refreshVisibleMarkerPresentationImpl) {
        refreshVisibleMarkerPresentationImpl();
      }
    }

    function sendPinMessage(catalogNumber, latitude, longitude) {
      const msg = {
        type: PIN_OBSERVATION_MESSAGE_TYPE,
        catalogNumber: catalogNumber,
        latitude: latitude,
        longitude: longitude,
      };
      if (window.ReactNativeWebView) {
        window.ReactNativeWebView.postMessage(JSON.stringify(msg));
      } else {
        window.parent.postMessage(msg, window.location.origin);
      }
      map.closePopup();
    }

    function sendOpenExternalUrlMessage(url) {
      const msg = {
        type: OPEN_EXTERNAL_URL_MESSAGE_TYPE,
        url: url,
      };
      if (window.ReactNativeWebView) {
        window.ReactNativeWebView.postMessage(JSON.stringify(msg));
      } else {
        window.parent.postMessage(msg, '*');
      }
    }

    function handlePinButtonClick(event) {
      const clickTarget = event && event.target;
      const pinButton = clickTarget && typeof clickTarget.closest === 'function'
        ? clickTarget.closest('[data-pin-observation="true"]')
        : null;
      if (!pinButton || !pinButton.dataset) {
        return;
      }

      const catalogNumber = pinButton.dataset.catalogNumber
        ? decodeURIComponent(pinButton.dataset.catalogNumber)
        : '';
      const latitude = Number(pinButton.dataset.latitude);
      const longitude = Number(pinButton.dataset.longitude);
      if (!catalogNumber || !isFinite(latitude) || !isFinite(longitude)) {
        return;
      }

      event.preventDefault?.();
      sendPinMessage(catalogNumber, latitude, longitude);
    }

    function buildPinButtonHtml(catalogNumber, latitude, longitude, marginTop) {
      if (!ALLOW_PIN_OBSERVATIONS) {
        return '';
      }
      const resolvedMarginTop = typeof marginTop === 'string' ? marginTop : '6px';
      return '<button type="button" data-pin-observation="true" data-catalog-number="' + encodeURIComponent(catalogNumber) + '" data-latitude="' + latitude + '" data-longitude="' + longitude + '" style="display:block;margin-top:' + resolvedMarginTop + ';padding:4px 8px;font-size:12px;cursor:pointer;background:none;border:1px solid currentColor;border-radius:4px;width:100%;text-align:left;">Highlight in Environmental Features</button>';
    }

    function buildMapClickPopup(latitude, longitude) {
      const syntheticCatalog = 'point:' + latitude.toFixed(6) + ',' + longitude.toFixed(6);
      return buildPinButtonHtml(syntheticCatalog, latitude, longitude);
    }

    function handleExternalLinkClick(event) {
      const clickTarget = event && event.target;
      const externalLink = clickTarget && typeof clickTarget.closest === 'function'
        ? clickTarget.closest('[data-open-external-url="true"]')
        : null;
      if (!externalLink) {
        return false;
      }

      const url = externalLink.getAttribute('href');
      if (!url) {
        return false;
      }

      event.preventDefault?.();
      sendOpenExternalUrlMessage(url);
      return true;
    }

    function styleForCatalog(catalog) {
      return activeHighlightCatalogs.has(catalog) ? highlightStyle : markerStyle;
    }

    function applyHighlights(list) {
      activeHighlightCatalogs.clear();
      if (Array.isArray(list)) {
        list.forEach((item) => {
          activeHighlightCatalogs.add(String(item));
        });
      }
      markers.forEach((marker, catalog) => {
        marker.setStyle(styleForCatalog(catalog));
      });
    }

    function handleHighlightMessage(payload) {
      let data = payload;
      if (typeof payload === 'string') {
        try {
          data = JSON.parse(payload);
        } catch {
          return;
        }
      }
      if (data && data.type === HIGHLIGHT_MESSAGE_TYPE) {
        applyHighlights(data.catalogs || []);
        return;
      }

      if (data && data.type === SELECTED_POINT_MESSAGE_TYPE) {
        applySelectedPoint(data.point || null);
      }
    }

    function applySelectedPoint(point) {
      if (selectedCatalogDirectMarker) {
        map.removeLayer(selectedCatalogDirectMarker);
        selectedCatalogDirectMarker = null;
      }

      restorePreviouslySelectedMarker();

      if (selectedCatalogKey != null) {
        selectedCatalogKey = null;
      }

      if (selectedPointMarker) {
        map.removeLayer(selectedPointMarker);
        selectedPointMarker = null;
      }

      if (!point || typeof point.latitude !== 'number' || typeof point.longitude !== 'number') {
        refreshVisibleMarkerPresentation();
        return;
      }

      const latitude = clampLatitude(point.latitude);
      const longitude = Number(point.longitude);
      if (!isFinite(latitude) || !isFinite(longitude)) {
        refreshVisibleMarkerPresentation();
        return;
      }

      const alignedLongitude = alignLongitudeToView(longitude, map.getCenter().lng);
      const matchingEntry = markerEntries.length
        ? markerEntries.find(function(e) {
            return Math.abs(e.latitude - latitude) < 1e-6 &&
                   Math.abs(e.longitude - longitude) < 1e-6;
          })
        : null;

      if (matchingEntry) {
        selectedCatalogKey = matchingEntry.key;

        if (visibleMarkerLayer && matchingEntry.directMarker) {
          visibleMarkerLayer.removeLayer(matchingEntry.directMarker);
          matchingEntry.directMarker = null;
        }

        hideClusterMarker(matchingEntry);

        selectedCatalogDirectMarker = L.circleMarker(
          [latitude, alignedLongitude],
          { radius: markerStyle.radius, fillOpacity: 0, fillColor: 'transparent',
            color: palette.selectedPointStroke, weight: 2, opacity: 1, dashArray: '2 2' },
        );
        if (matchingEntry.popupHtml) {
          selectedCatalogDirectMarker.bindPopup(matchingEntry.popupHtml);
        }
        map.addLayer(selectedCatalogDirectMarker);
        refreshVisibleMarkerPresentation();
        return;
      }

      selectedPointMarker = L.circleMarker(
        [latitude, alignedLongitude],
        { radius: markerStyle.radius, fillOpacity: 0, fillColor: 'transparent',
          color: palette.selectedPointStroke, weight: 2, opacity: 1, dashArray: '2 2' },
      ).addTo(map);

      refreshVisibleMarkerPresentation();
    }

    document.addEventListener('click', (event) => {
      if (handleExternalLinkClick(event)) {
        return;
      }
      handlePinButtonClick(event);
    });
    document.addEventListener('message', (event) => handleHighlightMessage(event.data));
    window.addEventListener('message', (event) => handleHighlightMessage(event.data));

    let markerEntries = [];
    let clusterGroup = null;
    let visibleMarkerLayer = null;
    let showingVisibleIndividualMarkers = false;

    function hideClusterMarker(entry) {
      if (!clusterGroup || !entry || !entry.clusterMarker || entry.clusterMarkerHidden) {
        return;
      }
      clusterGroup.removeLayer(entry.clusterMarker);
      entry.clusterMarkerHidden = true;
    }

    function restoreClusterMarker(entry) {
      if (!clusterGroup || !entry || !entry.clusterMarker || !entry.clusterMarkerHidden) {
        return;
      }
      clusterGroup.addLayer(entry.clusterMarker);
      entry.clusterMarkerHidden = false;
    }

    function restorePreviouslySelectedMarker() {
      if (selectedCatalogKey == null) {
        return;
      }

      const previousEntry = markerEntries.find(function(e) { return e.key === selectedCatalogKey; });
      if (previousEntry) {
        restoreClusterMarker(previousEntry);
      }
    }

    if (SHOW_MARKERS && Array.isArray(points) && points.length) {
      const observedBounds = [];
      const directMarkerAnchors = [];
      const useVisibilityManagedClustering =
        points.length > MAX_VISIBLE_UNCLUSTERED_OBSERVATIONS;
      clusterGroup = useVisibilityManagedClustering
        ? L.markerClusterGroup({
          spiderfyOnMaxZoom: false,
          chunkedLoading: true,
          chunkInterval: 120,
          chunkDelay: 20,
        })
        : null;
      visibleMarkerLayer = useVisibilityManagedClustering ? L.layerGroup() : null;
      showingVisibleIndividualMarkers = !useVisibilityManagedClustering;

      function buildObservationPopup(catalogNumber, catalogHref, catalogLabel, latitude, longitude) {
        if (!LINK_OBSERVATIONS || !catalogHref || !catalogLabel) {
          return '';
        }
        return '<a href="https://www.inaturalist.org/observations/' + catalogHref + '" target="_blank" rel="noopener noreferrer" data-open-external-url="true">Observation #' + catalogLabel + '</a>';
      }

      function bindObservationMarkerEvents(marker, catalogValue, catalogHref, catalogLabel, latitude, longitude) {
        var inatHtml = (LINK_OBSERVATIONS && catalogLabel && catalogHref)
          ? '<a href="https://www.inaturalist.org/observations/' + catalogHref + '" target="_blank" rel="noopener noreferrer" data-open-external-url="true">Observation #' + catalogLabel + '</a>'
          : '';
        marker.on('click', function(e) {
          L.DomEvent.stopPropagation(e);
          if (ALLOW_PIN_OBSERVATIONS && catalogValue) {
            sendPinMessage(catalogValue, latitude, longitude);
          }
        });
      }

      function applyEntryStyle(entry, style) {
        entry.clusterMarker?.setStyle(style);
        entry.directMarker?.setStyle(style);
      }

      function visibleEntriesForCurrentView(centerLongitude) {
        const currentBounds = map.getBounds();
        const visibleEntries = [];
        markerEntries.forEach((entry) => {
          const alignedLongitude = alignLongitudeToView(entry.longitude, centerLongitude);
          if (currentBounds.contains(L.latLng(entry.latitude, alignedLongitude))) {
            visibleEntries.push({ entry, alignedLongitude });
          }
        });
        return visibleEntries;
      }

      function ensureVisibleDirectMarker(entry, alignedLongitude) {
        if (!visibleMarkerLayer) {
          return;
        }
        if (entry.key === selectedCatalogKey) {
          return;
        }
        if (!entry.directMarker) {
          entry.directMarker = L.circleMarker(
            [entry.latitude, alignedLongitude],
            styleForCatalog(entry.key),
          );
          if (entry.popupHtml) {
            entry.directMarker.bindPopup(entry.popupHtml);
          }
          visibleMarkerLayer.addLayer(entry.directMarker);
        } else {
          entry.directMarker.setLatLng([entry.latitude, alignedLongitude]);
          entry.directMarker.setStyle(styleForCatalog(entry.key));
        }
        entry.alignedLongitude = alignedLongitude;
      }

      function removeVisibleDirectMarker(entry) {
        if (!visibleMarkerLayer || !entry.directMarker) {
          return;
        }
        visibleMarkerLayer.removeLayer(entry.directMarker);
        entry.directMarker = null;
      }

      function syncDirectMarkersToCurrentWorld() {
        const centerLongitude = map.getCenter().lng;
        directMarkerAnchors.forEach((entry) => {
          const alignedLongitude = alignLongitudeToView(entry.longitude, centerLongitude);
          entry.marker.setLatLng([entry.latitude, alignedLongitude]);
          entry.alignedLongitude = alignedLongitude;
        });

        if (selectedCatalogDirectMarker && selectedCatalogKey != null) {
          const selEntry = markerEntries.find(function(e) { return e.key === selectedCatalogKey; });
          if (selEntry) {
            const alignedLon = alignLongitudeToView(selEntry.longitude, centerLongitude);
            selectedCatalogDirectMarker.setLatLng([selEntry.latitude, alignedLon]);
          }
        }
      }

      function syncClusterMarkersToCurrentWorld() {
        if (!clusterGroup) {
          return false;
        }

        const centerLongitude = map.getCenter().lng;
        let changed = false;

        markerEntries.forEach((entry) => {
          const alignedLongitude = alignLongitudeToView(entry.longitude, centerLongitude);
          if (entry.alignedLongitude === alignedLongitude) {
            return;
          }

          entry.clusterMarker.setLatLng([entry.latitude, alignedLongitude]);
          entry.alignedLongitude = alignedLongitude;
          changed = true;
        });

        return changed;
      }

      function rebuildClusterGroupIfNeeded() {
        if (!clusterGroup || showingVisibleIndividualMarkers) {
          return;
        }

        if (!syncClusterMarkersToCurrentWorld()) {
          return;
        }

        map.removeLayer(clusterGroup);
        clusterGroup.addTo(map);
      }

      refreshVisibleMarkerPresentationImpl = function() {
        if (!useVisibilityManagedClustering || !clusterGroup || !visibleMarkerLayer) {
          syncDirectMarkersToCurrentWorld();
          return;
        }

        const centerLongitude = map.getCenter().lng;
        const visibleEntries = visibleEntriesForCurrentView(centerLongitude);
        const shouldShowVisibleIndividuals =
          visibleEntries.length > 0 &&
          visibleEntries.length <= MAX_VISIBLE_UNCLUSTERED_OBSERVATIONS;

        if (shouldShowVisibleIndividuals) {
          if (!showingVisibleIndividualMarkers) {
            map.removeLayer(clusterGroup);
            visibleMarkerLayer.addTo(map);
            showingVisibleIndividualMarkers = true;
          }

          const visibleKeys = new Set();
          visibleEntries.forEach(({ entry, alignedLongitude }) => {
            visibleKeys.add(entry.key);
            ensureVisibleDirectMarker(entry, alignedLongitude);
          });

          markerEntries.forEach((entry) => {
            if (!visibleKeys.has(entry.key)) {
              removeVisibleDirectMarker(entry);
            }
          });

          if (selectedCatalogDirectMarker && selectedCatalogKey != null) {
            const selEntry = markerEntries.find(function(e) { return e.key === selectedCatalogKey; });
            if (selEntry) {
              const alignedLon = alignLongitudeToView(selEntry.longitude, centerLongitude);
              selectedCatalogDirectMarker.setLatLng([selEntry.latitude, alignedLon]);
            }
          }
          return;
        }

        markerEntries.forEach(removeVisibleDirectMarker);
        if (showingVisibleIndividualMarkers) {
          map.removeLayer(visibleMarkerLayer);
          clusterGroup.addTo(map);
          showingVisibleIndividualMarkers = false;
        }

        rebuildClusterGroupIfNeeded();

        if (selectedCatalogDirectMarker && selectedCatalogKey != null) {
          const selEntry = markerEntries.find(function(e) { return e.key === selectedCatalogKey; });
          if (selEntry) {
            const alignedLon = alignLongitudeToView(selEntry.longitude, centerLongitude);
            selectedCatalogDirectMarker.setLatLng([selEntry.latitude, alignedLon]);
          }
        }
      };

      points.forEach((pt, idx) => {
        if (typeof pt.latitude !== 'number' || typeof pt.longitude !== 'number') {
          return;
        }

        const latitude = clampLatitude(pt.latitude);
        const canonicalLongitude = Number(pt.longitude);
        if (!isFinite(latitude) || !isFinite(canonicalLongitude)) {
          return;
        }

        const initialLongitude = alignLongitudeToView(canonicalLongitude, 0);
        const catalog = pt.catalogNumber ? String(pt.catalogNumber) : '';
        const markerKey = catalog.length ? catalog : 'fallback-' + String(idx);
        const popupHtml = buildObservationPopup(
          pt.popupCatalogValue,
          pt.popupCatalogHref,
          pt.popupCatalogLabel,
          latitude,
          canonicalLongitude,
        );

        if (useVisibilityManagedClustering && clusterGroup) {
          const clusterMarker = L.circleMarker(
            [latitude, initialLongitude],
            styleForCatalog(markerKey),
          );
          if (popupHtml) {
            clusterMarker.bindPopup(popupHtml);
          }
          bindObservationMarkerEvents(clusterMarker, pt.popupCatalogValue, pt.popupCatalogHref, pt.popupCatalogLabel, latitude, canonicalLongitude);

          const markerEntry = {
            key: markerKey,
            latitude,
            longitude: canonicalLongitude,
            alignedLongitude: initialLongitude,
            popupHtml,
            clusterMarker,
            clusterMarkerHidden: false,
            directMarker: null,
          };

          clusterGroup.addLayer(clusterMarker);
          markerEntries.push(markerEntry);
          markers.set(markerKey, {
            setStyle(style) {
              applyEntryStyle(markerEntry, style);
            },
          });
        } else {
          const marker = L.circleMarker(
            [latitude, initialLongitude],
            styleForCatalog(markerKey),
          );
          if (popupHtml) {
            marker.bindPopup(popupHtml);
          }
          bindObservationMarkerEvents(marker, pt.popupCatalogValue, pt.popupCatalogHref, pt.popupCatalogLabel, latitude, canonicalLongitude);
          map.addLayer(marker);
          directMarkerAnchors.push({
            marker,
            latitude,
            longitude: canonicalLongitude,
            alignedLongitude: initialLongitude,
          });
          markers.set(markerKey, marker);
        }

        observedBounds.push([latitude, initialLongitude]);
      });

      if (useVisibilityManagedClustering && clusterGroup) {
        map.addLayer(clusterGroup);
      }

      if (observedBounds.length) {
        map.fitBounds(observedBounds, { padding: [20, 20] });
      } else {
        map.setView([0, 0], BASE_MIN_ZOOM);
      }

      map.on('moveend', refreshVisibleMarkerPresentation);
      map.on('zoomend', refreshVisibleMarkerPresentation);
      refreshVisibleMarkerPresentation();
    } else {
      map.setView([0, 0], BASE_MIN_ZOOM);
    }

    map.on('click', function(event) {
      if (!ALLOW_PIN_OBSERVATIONS) {
        map.closePopup();
        return;
      }
      const latitude = Number(event.latlng?.lat);
      const longitude = Number(event.latlng?.lng);
      if (!isFinite(latitude) || !isFinite(longitude)) {
        return;
      }
      sendPinMessage('point:' + latitude.toFixed(6) + ',' + longitude.toFixed(6), latitude, longitude);
      map.closePopup();
    });

    applyHighlights([]);
    applySelectedPoint(null);
  </script>
</body>

</html>
